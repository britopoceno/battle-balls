<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Battle Balls — fase 3</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0a0c11;
        color: #e9edf5; font-family: system-ui, -apple-system, sans-serif;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #c { display: block; width: 100vw; height: 100dvh; touch-action: none; }

      #overlay {
        position: fixed; inset: 0; display: none; z-index: 10;
        background: rgba(8, 10, 14, 0.94); backdrop-filter: blur(6px);
        padding: 24px; overflow: auto;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      }
      #overlay.show { display: flex; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; font-weight: 700; }
      h1 span {
        font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
        vertical-align: middle; margin-left: 10px; padding: 3px 8px; border-radius: 99px;
        background: rgba(255,255,255,0.09); color: #9aa6bd;
      }
      .sub { margin: 0; color: #9aa6bd; font-size: 14px; text-align: center; }
      .sub b { color: #4dd6ff; }

      #picks { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
      .card {
        border: 1px solid rgba(255,255,255,0.1); border-top: 3px solid var(--cor);
        border-radius: 12px; padding: 14px; width: 300px; background: rgba(255,255,255,0.025);
      }
      .card h3 {
        margin: 0 0 12px; font-size: 17px; display: flex;
        align-items: baseline; justify-content: space-between; color: var(--cor);
      }
      .card h3 span {
        font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: #6f7c93;
      }
      .grupo { margin-bottom: 12px; }
      .grupo > label {
        display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #6f7c93; margin-bottom: 5px; font-weight: 600;
      }
      .op {
        display: block; width: 100%; text-align: left; margin-bottom: 5px; cursor: pointer;
        background: rgba(255,255,255,0.04); border: 1px solid transparent;
        border-radius: 8px; padding: 8px 10px; color: #c7d0e0; font: inherit;
        /*
          Piso de alvo de toque. Medido em Pixel 9 deitado: os quatro botões de "trocar build" da
          loja saíam com 35px, abaixo do mínimo de toque usual (44px). Eles são os únicos `.op` sem
          linha de descrição, e são justamente os que custam 5 de ouro por D-01 — errar o dedo ali
          tem preço. Os demais `.op` já vinham com 46-67px, então isto só levanta esses quatro.
        */
        min-height: 44px;
      }
      .op b { display: block; font-size: 13px; font-weight: 600; }
      .op i { display: block; font-style: normal; font-size: 11px; color: #7f8ba3; margin-top: 2px; line-height: 1.35; }
      .op.sel { background: color-mix(in srgb, var(--cor) 16%, transparent); border-color: var(--cor); }
      .op.sel b { color: var(--cor); }

      /* draft (`e3.4`): o card é o próprio botão de escolha — `.op` sozinho viraria 100% de largura */
      .card.op { width: 220px; text-align: center; padding: 18px 14px; }
      .card.op b { font-size: 16px; }
      .card.op:disabled { opacity: 0.45; cursor: default; }
      .op:disabled { opacity: 0.4; cursor: default; }
      /* loja/placar (`e3.4`): a tela é a mais alta da fase — precisa rolar, não centralizar à força */
      #overlay { justify-content: flex-start; }

      /* `e3.5` — discreto e sempre alcançável; canto inferior central, onde não há botão de habilidade */
      #exportar {
        position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: 10px;
        cursor: pointer; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
        padding: 6px 12px; font: 500 11px system-ui, sans-serif;
        background: rgba(20,24,32,0.82); color: #7f8ba3;
      }
      #exportar:hover { color: #c7d0e0; border-color: rgba(255,255,255,0.28); }

      /*
        A ação primária fica GRUDADA no rodapé do overlay.

        Medido em viewport de celular deitado (Pixel 9, 768×425 CSS): a tela de builds tem 642px de
        conteúdo, e o "Pronto" nascia 158px ABAIXO da dobra — com o timer de 30s de RF-04 correndo.
        Quem não descobrisse que a tela rola veria o tempo acabar e a `{t:'buildPadrao'}` sobrescrever
        a build que acabou de escolher. Na loja é o mesmo botão e o mesmo risco, sem timer.

        `sticky` e não `fixed`: ele volta ao fluxo quando a tela cabe inteira (telas curtas, desktop),
        em vez de pairar sobre o conteúdo o tempo todo.
      */
      #start {
        cursor: pointer; border: 0; border-radius: 10px; padding: 13px 34px;
        font: 600 15px system-ui, sans-serif; color: #08111a; background: #4dd6ff;
        /* 46px, e não 12: o #exportar é fixo no rodapé central e os dois se empilham em vez de colidir */
        position: sticky; bottom: 46px; z-index: 5; flex: none;
        box-shadow: 0 6px 22px rgba(8, 10, 14, 0.92), 0 0 0 10px rgba(8, 10, 14, 0.72);
      }
      .hint { margin: 0; font-size: 11px; color: #5e6a80; text-align: center; line-height: 1.6; }
      .hint code {
        background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 4px; color: #9aa6bd;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!--
      O conteúdo do overlay é gerado por `src/client/telas.ts` a partir de `FaseDaPartida` (story
      `e3.4`, arquitetura §11.1): draft, builds, loja/placar e fim. Deixar markup estático aqui seria
      uma segunda fonte de verdade para a tela — e ele seria descartado no primeiro `desenharTela`.
    -->
    <div id="overlay" class="show"></div>
    <!--
      `e3.5` AC 5 — gatilho de exportação da telemetria. FORA do #overlay: `telas.ts` recria o
      conteúdo do overlay a cada fase, e um botão lá dentro sumiria a cada transição. z-index acima
      do overlay para continuar alcançável nas telas de DOM e durante a rodada.
    -->
    <button id="exportar" title="exportar telemetria como JSON (atalho: T)">⬇ telemetria</button>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
