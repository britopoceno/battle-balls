status_reason: >-
  Os 8 ACs passam sob verificação independente, e a peça mais forte deste gate não é um teste: é uma
  PROVA DE ESCOPO por reversão. Reverti a correção de BOT-001 numa cópia de `src/` e o
  `src/bot/heuristic.ts` resultante bate byte a byte o sha256 que o gate de `e2.3` registrou
  (`80dcd986…`) — logo o delta desta story naquele arquivo é EXATAMENTE a linha de BOT-001 mais o
  comentário de rastreabilidade, e nada mais. Com a correção revertida, `sim:check` falha só na
  guarda BOT-001 (2 comandos, EXIT=1) e as outras nove linhas de saída ficam idênticas: o teste não
  é vácuo E a correção não move nenhum hash, provados na mesma execução.
  Três testes negativos próprios, rodados em cópias perturbadas: `Math.random` no saque de
  agendamento → 5/5 seeds divergem; `Math.random` nos saques de jitter → 5/5; escrita em
  `view.balls[0].hp` (N-3) → 4/5 no bloco de replay, reproduzindo os hashes do @dev dígito a dígito.
  Golden hash e BUILD_BASELINE recomputados por arnês próprio contra `architecture.md` §6.0
  transcrita à mão: 10/10. A decisão de NÃO guardar `peso` é engenharia sólida e foi verificada nos
  dois braços do argumento — sem objeção.
