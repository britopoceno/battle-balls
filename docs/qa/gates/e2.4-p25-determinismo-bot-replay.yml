blocking: false
blocks_downstream: false
downstream_note: >-
  `e2.5` está LIBERADA. O portão P2.5 está fechado com os dois testes que §3.3 exige, ambos com poder
  de detecção MEDIDO (autoconsistência 5/5 em dois vetores de não-determinismo; replay 4/5 no vetor de
  N-3), e BOT-001 — a entrada obrigatória herdada do gate de `e2.3` — está corrigida, testada em
  permanência no `sim:check` e provada hash-neutra. A rede de segurança que o passo 4 de §7 exige
  antes do CLI existe de fato.
  Entradas que `e2.5` continua carregando do gate de `e2.3`: BOT-002 (`Object.freeze` no
  `PRESET_ARNES`, que é `Readonly` só de tipo) e BOT-003 (tick mediano do primeiro cast por slot na
  métrica de utilização de kit). Acrescento BOT-006: essa mesma métrica é o detector do estado
  "fail-closed por NaN", e "zero casts por VE na rodada" deve ser reportado, não agregado em silêncio.
  `e2.6` continua levando a metade de raiz de BOT-001 (`Number.isFinite` em `itemBonus` na entrada do
  CLI) e agora também BOT-007: validar na raiz fecha os três caminhos de decisão de uma vez, o que é o
