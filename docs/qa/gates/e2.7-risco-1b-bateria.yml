top_issues:
  - id: 'QA-E27-001'
    severity: medium
    category: tests
    finding: >-
      O SINAL do delta é decidido num call site que nenhuma asserção cobre. `deltaPp()` tem 4
      asserções dedicadas (as duas bordas de float, o delta negativo, as 2 casas) — mas a ORDEM DOS
      ARGUMENTOS que `rodarBateria1b` passa para ela não é asserida em lugar nenhum. Medido: trocar
      `deltaPp(linha.res, controle!)` por `deltaPp(controle!, linha.res)` roda limpo, EXIT=0, e
      imprime uma tabela plausível (`golem físico +0.00pp · dano -33.33pp → gatilho: NÃO`). Como a
      coluna `delta` da tabela A/B e a seção `risco #1b` são alimentadas pela MESMA variável, as
      duas invertem juntas e nada cruza. O sinal é o conteúdo inteiro do indicador — `físico < +2pp`
      é comparação com sinal — então um delta invertido leria "a trilha física nasce morta" quando
      o dado diz o contrário. Terceira ocorrência desta classe no épico (QA de e2.5: "a fiação entre
      partes testadas não é testada"; QA de e2.6: "perturbar a fiação que lê a constante").
    suggested_action: >-
      Asserir o sinal onde ele é usado, não onde é calculado: no momento da impressão (ou num
      autoteste que dirija `rodarBateria1b` com um `rodarAb` de stub), conferir
      `Math.sign(deltaPp) === Math.sign(winrate_tratamento − winrate_controle)` para cada linha. É
      uma linha e fecha a única perturbação desta story que passou despercebida.

  - id: 'QA-E27-002'
    severity: medium
    category: requirements
    finding: >-
      A guarda de divergência dos controles é só de console; o `--json` não a expõe. Forcei a
      divergência (controle do vex rodado com `seedBase+1`): o console imprimiu o ⚠ com o conteúdo
      certo ("os controles dos personagens DIVERGIRAM (golem 11/20 · vex 9/20)"), logo a guarda é
      viva e não vácua. Mas na mesma execução o `--json` trouxe `risco1b` sem nenhum vestígio —
      `JSON.stringify(risco1b).includes('diverg') === false` — e os dois personagens com
      `gatilho: true, gatilhoNaoAvaliavel: null`, como se a medição fosse válida. A justificativa
      que a própria story dá para a guarda existir ("falha invisível", "a tabela inteira é lixo") se
      aplica literalmente ao caminho de máquina, que é justamente o consumidor que não lê o rodapé.
      No console o processo também sai 0 e imprime SIM/NÃO como se valessem.
    suggested_action: >-
      Acrescentar `controlesDivergiram: boolean` (com os pares vitórias/decididas por personagem) ao
      objeto `risco1b` do `--json` e, quando divergirem, emitir `gatilho: null` com
      `gatilhoNaoAvaliavel` preenchido — a regra "não deu para medir ≠ não disparou" que o código já
      aplica corretamente ao caso sem decididas.

  - id: 'QA-E27-003'
    severity: low
    category: code
    finding: >-
      O arredondamento de `deltaPp()` a 2 casas é a correção CERTA para a borda que ele nomeia, e a
      alegação do @dev foi confirmada de forma independente: `(0.5−0.45)·100` vale
      `4.999999999999999` e `(0.5−0.48)·100` vale `2.0000000000000018` — o mesmo fato cai dos dois
      lados da borda. No caminho aritmético REAL (`vitorias/nDec`) é pior do que o @dev descreveu:
      `440/800 − 400/800` dá `5.000000000000004`, e o comparador estrito `> 5` DISPARA num delta que
      é matematicamente +5,00pp exatos, quando a leitura literal do indicador manda não disparar.
      Remover o `Math.round` é barrado por asserção viva (EXIT=1, com esses mesmos valores na
      mensagem). Dois resíduos, nenhum bloqueante: (a) a n=800 a granularidade do delta é 0,125pp,
      então todo múltiplo ÍMPAR de 0,125 cai exatamente no empate de 2 casas e o `Math.round` o
      resolve por poeira de float, não por regra — os próprios números publicados por esta story
      mostram isso: golem físico é matematicamente +2,625pp e sai `+2.62pp` (para BAIXO) enquanto
      golem dano é +10,625pp e sai `+10.63pp` (para CIMA), o mesmo empate decidido nos dois sentidos
      em linhas vizinhas da mesma tabela. Inofensivo para o gatilho (os limiares 2 e 5 são múltiplos
      exatos de 0,125, isto é 16 e 40 vitórias), mas o não-determinismo de float foi DESLOCADO do
      limiar inteiro para o meio-centavo, não removido. (b) Com `n` maior — que é o que o próprio
      rodapé do CLI manda usar antes de decidir — o arredondamento pode INVERTER o gatilho: medido a
      n=20000, um delta verdadeiro de +1,995pp (`< 2` → arma) arredonda para exatamente 2,00
      (`< 2` → desarma). Confirmada a mitigação que o @dev alega: o `--json` preserva mesmo os
      `winrate` e `nDec` cheios dos dois lados, então dá para recomputar exato.
    suggested_action: >-
      Manter o arredondamento para IMPRESSÃO e decidir o gatilho no domínio inteiro, onde não há
      float nenhum: com `n_dec` igual nas duas linhas, `delta < 2pp` é exatamente
      `100·(v_trat − v_ctrl) < 2·n`. Exato em qualquer `n`, dispensa regra de arredondamento e
      elimina os dois resíduos de uma vez.

  - id: 'QA-E27-004'
    severity: medium
    category: requirements
    finding: >-
      O rodapé sobre limiares finos EXISTE (é o que o gate anterior pediu, e é progresso real), mas
      nomeia uma grandeza que não é a que está sendo testada: "os limiares (+2pp/+5pp) são finos
      perto do IC de CADA WINRATE (±3.46pp a n=800)". O que é comparado contra o limiar é o DELTA, e
      o CLI nunca imprime o intervalo do delta em lugar nenhum.
      CORREÇÃO DO MEU PRÓPRIO ACHADO ANTERIOR: no gate de e2.6 registrei o IC do delta como ±4,90pp,
      derivado da fórmula NÃO PAREADA `1,96·√(2·0,25/n)`. Esta story usa desenho pareado (mesma seed
      base para controle e tratamento), e agora eu MEDI em vez de derivar — na varredura de 4 bases
      de seed abaixo, o desvio-padrão do delta de golem físico é ≈1,25pp (estimativa grosseira, 4
      pontos), o que dá IC ≈ ±2,5pp. Ou seja: o pareamento cancela mesmo boa parte da variância
      comum, o ±4,90pp que registrei em e2.6 SUPERESTIMA, e o ±3,46pp que este rodapé imprime é, por
      acaso, conservador. O achado sobrevive à correção porque não depende de qual dos três números
      se usa: ±2,5pp em torno da leitura de golem físico (+2,62pp) dá [+0,12 ; +5,12], que ATRAVESSA
      o limiar de +2,00pp. O veredito do golem não é decidível a n=800 — e isso não é inferência, é
      observação direta: ele inverte para SIM na base de seed 3001.
    suggested_action: >-
      Imprimir o IC DO DELTA ao lado de cada par (medido, não derivado da fórmula não pareada), ou
      no mínimo dizer no rodapé que o ±3,46pp da coluna é do winrate e não do delta. Enquanto não
      houver, nenhuma decisão de Fase 3/5 deve ser tomada sobre o gatilho lido no piso de RF-48.

  - id: 'QA-E27-005'
    severity: low
    category: docs
    finding: >-
      Duas consequências cosméticas de a ordem de `NOMES_PACOTE` deixar de governar a bateria. Com
      a lista invertida em `packages.ts`, os NÚMEROS e os VEREDITOS saem idênticos (é o que
      QA-E26-003 pedia e está resolvido), mas a ordem do PAR dentro da linha impressa passa a ser
      `dano … · físico …`, enquanto a legenda continua dizendo `(fis<+2 e dano>+5)` — a saída deixa
      de bater com §6.3 sem que nada acuse. Além disso a ordem das LINHAS segue `--comp`, então a
      saída real sai (golem, vex) e o exemplo de §6.3 sai (vex, golem). Nenhum dos dois afeta
      medição.
    suggested_action: >-
      Se a fidelidade a §6.3 importa como contrato, impor também a ordem de apresentação do par
      (físico antes de dano) da mesma forma que `ordemDaBateria` impõe a do controle. Caso
      contrário, registrar em §6.3 que a ordem é derivada de `--comp` e de `NOMES_PACOTE`.

