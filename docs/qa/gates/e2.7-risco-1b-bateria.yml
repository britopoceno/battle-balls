achado_empirico_para_fase5:
  titulo: 'O gatilho do golem INVERTE ao trocar só a base de seed, com o mesmo n=800'
  metodo: >-
    Varredura de base de seed (a técnica que separa "o pipeline é injusto" de "a amostra é azarada",
    do gate de e2.6). Quatro execuções completas da bateria a n=800, mudando só --seed.
  tabela: |
    seed base | golem físico | golem dano | vex físico | vex dano | gatilho golem | gatilho vex
    1 (padrão)|    +2.62pp   |  +10.63pp  |  +8.38pp   | +17.63pp |      NÃO      |     NÃO
    1001      |    +4.50pp   |  +11.13pp  |  +8.87pp   | +20.37pp |      NÃO      |     NÃO
    2001      |    +3.25pp   |   +9.25pp  |  +9.75pp   | +22.88pp |      NÃO      |     NÃO
    3001      |    +1.50pp   |   +9.75pp  |  +7.13pp   | +19.63pp |      SIM      |     NÃO
  leitura: >-
    O veredito do VEX é robusto: o físico dele fica 5–8pp acima do limiar de +2 em todas as bases, e
    o dano muito acima de +5. O veredito do GOLEM não é: o físico dele varia de +1,50pp a +4,50pp
    (3,00pp de amplitude, sd ≈ 1,25pp) em torno de um limiar de +2,00pp, e o dano fica sempre acima
    de +5 — ou seja o gatilho do golem depende INTEIRAMENTE da metade física, que é a metade
    instável. Na base 3001 ele dispara. Em 4 bases, 1 disparo.
    A leitura da base padrão (+2,62pp) está a só 0,62pp do limiar enquanto a amplitude observada é
    quase 5× isso. Isto NÃO é defeito da story — é exatamente o que o rodapé que o @dev acrescentou
    avisa ("um gatilho lido no piso de RF-48 é leitura de ruído"), e a story é aceita pela FORMA da
    saída, não pela magnitude. Mas transforma QA-E27-004 de preciosismo em consequência: quem ler
    "gatilho: NÃO" a n=800 e concluir que a trilha física está viva estará lendo uma moeda.
  recomendacao: >-
    Nenhuma decisão de Fase 3 ou Fase 5 sobre o Risco #1b deve ser tomada com n=800. Antes de o @pm
    decidir a regra de agregação (R-04), rodar a bateria a n ≥ 3000 e em pelo menos 3 bases de seed,
    e reportar a média entre bases — que é uma agregação sobre REPETIÇÕES do mesmo personagem, não
    entre personagens, e portanto não é a agregação que §9/R-04 adiou.

pontos_fortes:
  - >-
    A linha vermelha da story foi respeitada com folga. `avaliarGatilho1b` recebe os tratamentos de
    um personagem por assinatura, o `--json` não tem nem sequer um contador de disparos, e o `nota`
    do JSON explica ao consumidor de máquina POR QUE não há um booleano único. Artigo IV respeitado:
    a regra de agregação não foi inventada.
  - >-
    QA-E26-003 foi resolvido no lugar certo (no consumidor que depende da ordem), sem tocar em
    `packages.ts`, e com duas camadas — autoteste sobre a função pura + guarda `falhar` no laço. A
    inversão real de `NOMES_PACOTE` prova que a proteção é da fiação, não só da função.
  - >-
    O desvio do arredondamento não foi só documentado: está PROTEGIDO por asserção viva. Remover o
    `Math.round` derruba o CLI com EXIT=1 e a mensagem traz os valores de float exatos. Documentar um
    desvio e depois deixá-lo sem rede é o padrão comum; isto é melhor.
  - >-
    Reuso integral do protocolo A/B: `rodarBateria1b` não tem uma linha de contabilidade de partida.
    As 6 medições entram na tabela A/B existente em vez de numa segunda tabela — o que faz IC,
    veredito de 3 estados, aviso de clamp e de truncamento virem de graça e consistentes.
  - >-
    A conferência de controles idênticos é uma ideia boa e barata que o @dev não precisava ter tido:
    duas medições redundantes que TÊM de bater transformam o custo do controle duplicado em
    verificação. Falta só levá-la ao `--json` (QA-E27-002).

