  ordem_dos_pacotes_QA-E26-003:
    verdict: RESOLVIDO DE PONTA A PONTA
    evidence: >-
      Não me contentei com o autoteste do @dev (que exercita só a função pura `ordemDaBateria`).
      Inverti `NOMES_PACOTE` DE VERDADE em `packages.ts` (`['dano','fisico','nenhum']`) numa cópia
      isolada e rodei o CLI: o controle continuou sendo medido PRIMEIRO para os dois personagens
      (stderr: `nenhum` antes de `dano`/`fisico`) e TODOS os deltas e vereditos saíram numericamente
      idênticos ao baseline (golem físico -10.00 · dano +15.00; vex físico -10.00 · dano +25.00;
      SIM/SIM). A escolha da opção (a) está correta e a fiação — não só a função — está protegida.
      Conferi também as duas camadas de defesa: tornar `ordemDaBateria` identidade é barrado pelo
      autoteste (EXIT=1) ANTES de qualquer rodada, e a guarda `falhar` de `rodarBateria1b` é o
      segundo freio.
