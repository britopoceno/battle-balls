issues:
  - id: ARCH-E30-001
    severity: medium
    category: docs
    finding: >-
      O censo extra de leitores de fração no Dev Agent Record está INCOMPLETO, e o que falta é o
      leitor de maior magnitude entre os de fora de `sim/`+`chars/`. O @dev declara "varredura de
      `src/` inteiro devolve 8 sítios" e lista 3 extras (`bot/heuristic.ts:483`,
      `client/render.ts:195`, `client/render.ts:302`). A varredura correta devolve **9 sítios**: falta
      `src/bot/heuristic.ts:350`, dentro de `peso()`, que é **decisão de bot** e não cosmético — é o
      peso de alvo que `valorEsperado()` (`heuristic.ts:337-343`) soma sobre todos os inimigos vivos
      para escolher QUANDO e ONDE castar. Diferente de todos os outros, este não tem limiar: é
      CONTÍNUO, `peso = 1 + PESO_FERIDO × (1 − frac)` com `PESO_FERIDO = 1.0` (`PRESET_ARNES`), então
      não existe "margem segura" onde ele não morda. Medido: vex `+100%` de `maxHp` tinha, com o bug,
      peso **1,500** contra 1,000 de quem não comprou nada — 50% mais atraente como alvo de
      habilidade **desde o tick 0**, pelo simples fato de ter comprado vida; a `+50%`, peso 1,333.
      Este é o irmão de `world.ts:244` (`weakestEnemy`) no lado do bot, e é um mecanismo de primeira
      ordem da inversão de sinal de §1.3 — provavelmente o maior deles, porque o Vex a `+50%` fica
      abaixo de todos os limiares de degrau e ainda assim sofre este peso cheio.
    impacto: >-
      Zero no código entregue: nada em `heuristic.ts` precisava mudar, e a correção no nascimento
      conserta este leitor junto com os outros oito. O impacto é de INSUMO: e3.1 e e3.6 vão medir a
      Couraça usando este registro como lista de mecanismos, e a lista está subdimensionada em
      exatamente o item que não tem degrau — o que é justamente o que explicaria um resíduo de sinal
      se ele aparecer na medição.
    recommendation: >-
      Registrado neste gate e nas QA Results. Recomendo que e3.1/e3.6 tratem o censo como
      **9 leitores, 5 em `sim/`+`chars/` (onde o golden hash é juiz) + 2 decisões de bot em
      `heuristic.ts:350` e `:483` + 2 cosméticos em `render.ts:195/302`**, e que
      `architecture-e3.md` §1.3 ganhe a nota de que "cinco leitores" é o censo do escopo onde o hash
      julga, não o censo de `src/`. Sem ação de código.

  - id: ARCH-E30-002
    severity: low
    category: docs
    finding: >-
      A nota de robustez sobre NaN cita `balance.ts:287` ao contrário do que a fonte diz. O @dev
      escreve que "`balance.ts:287` registra explicitamente que `{maxHp: NaN}` não é pego pela
      validação de lá". O comentário real diz o oposto: `{maxHp: NaN}` não é pego pelo **detector de
      kit morto**, e é EXATAMENTE por isso que "a validação tem de estar na raiz, e a raiz é esta
      função". E ela está: `analisarMutacao` (`balance.ts:295-325`) rejeita, para TODO `StatKey`
      incluindo `maxHp`, tanto o que não casa `FORMATO_VALOR` quanto o que não passa
      `Number.isFinite` — com mensagem nomeando BOT-006. Conferido no fonte.
    impacto: >-
      A conclusão do @dev (não corrigir aqui) fica MAIS forte, não mais fraca: hoje não existe
      caminho de produção não validado para `itemBonus`, porque o único que existe é o CLI de
      balanceamento e ele valida na raiz. O risco é a citação invertida ser reciclada em e3.1 como
      "a validação de `balance.ts` não pega maxHp", levando ou a validação redundante no lugar errado
      (dentro de `sim/`, terceira fonte de verdade) ou à conclusão falsa de que validação não existe
      em nenhum lugar.
    recommendation: >-
      Corrigir a leitura no registro (feito neste gate). Sem ação de código.

  - id: ARCH-E30-003
    severity: low
    category: docs
    finding: >-
      O comentário novo de `world.ts:170-181` embute números MEDIDOS que e3.6 vai remedir por
      desenho: "−18,86pp com o bug e +31,97pp corrigida". Medição residente em comentário envelhece
      sem aviso, e este projeto já paga caro por segundas fontes de verdade (C3, `AimSpec`) — este é
      o mesmo padrão em escala pequena, sobre número em vez de fórmula. O comentário também escreve
      "gatilho de CINCO comportamentos de combate" sem o qualificador `sim/`+`chars/` que torna a
      frase verdadeira (ver ARCH-E30-001) — embora ele nomeie os cinco, o que o salva de ser errado.
    impacto: >-
      Nenhum hoje. O comentário está correto na data de entrega e a referência a §1.3 está lá.
    recommendation: >-
      Quando e3.6 remedir o efeito da Couraça, ou atualizar os dois números ou trocá-los pela
      referência pura a §1.3. Não vale reabrir a story por isso.

decisoes_de_julgamento:
  - questao: >-
      O sexto leitor (`bot/heuristic.ts:483`, política de fuga) deveria ter sido corrigido nesta
      story?
    veredito: 'NÃO — e a decisão do @dev de só registrar é a arquiteturalmente correta'
    razao: >-
      Duas razões, e a segunda é mais importante que a primeira. (1) AC 7 é explícito: nenhuma linha
      fora de `src/sim/world.ts`. (2) **Não havia nada para corrigir em `:483`.** O reader está
      certo; o que estava errado era o INSUMO dele. `fracHp < cfg.FUGA` é a expressão correta da
      política de fuga — ela só produzia decisão ruim porque `hp` nascia mentindo. Corrigir no
      nascimento conserta os nove leitores de uma vez, na única fonte; mexer em leitor seria tratar
      sintoma e criar nove lugares onde a mesma regra vive. Este é o mesmo argumento que a dívida C3
      deste projeto já cobrou uma vez. Confirmei os números do @dev por medição própria e batem
      exatamente: golem `+100%` largava com 57,0 HP de margem até fugir e agora larga com 247,0;
      `+50%`, 90,3 → 185,3; vex `+100%`, 30,0 → 130,0; `+50%`, 47,5 → 97,5.
      Registrar como nota para quem medir a Couraça em e3.1/e3.6 é o destino certo — com a ressalva
      de que a nota precisa incluir o sétimo leitor (ARCH-E30-001).

  - questao: >-
      A decisão de NÃO corrigir a nota de robustez de NaN (`itemBonus: {maxHp: NaN}` ⇒ `hp = NaN`)
      nesta story é sólida?
    veredito: 'SIM — sólida, e por razões mais fortes do que as que o @dev deu'
    razao: >-
      Três. (1) **O placeholder não criou buraco; ele tornou um buraco existente audível.** Medido:
      com `{maxHp: NaN}` o `stat.maxHp` JÁ era NaN antes desta story, então `hp / stat.maxHp` já era
      NaN e todo leitor de degrau já caía no ramo "false" em silêncio. O antigo `hp = def.maxHp = 100`
      contra um teto NaN não era mais seguro — era mais DISFARÇADO: produzia um `hp` de aparência
      plausível sobre um estado já corrompido. `hp = NaN` é a versão barulhenta do mesmo defeito, e
      o projeto já tem guarda dessa classe no `sim:check` (BOT-001, `determinism.ts:327`). Trocar
      silêncio por barulho é a direção certa.
      (2) **Validar em `makeBall` colocaria validação dentro de `sim/`**, que neste projeto computa e
      não valida — seria a terceira fonte de verdade sobre "o que é um bônus legítimo", depois de
      `analisarMutacao` e da loja que ainda não existe. E a validação na raiz JÁ EXISTE para o único
      caminho vivo (ver ARCH-E30-002): o CLI de balanceamento rejeita não finito para todo `StatKey`.
      (3) O único caminho não validado que resta é PROGRAMÁTICO, e e3.1 é a story que cria o
      programa que o usa. O invariante "valores de `itemBonus` são finitos" ganha dono lá, onde o
      dado nasce, não onde ele é consumido.
      Ressalva registrada: a justificativa do @dev cita a fonte errada (ARCH-E30-002). O veredito não
      muda; o registro precisa.

recomendacoes_para_e3_1:
  - >-
    Herdar o censo de **9 leitores** de `hp / stat.maxHp` (ARCH-E30-001), com `heuristic.ts:350`
    `peso()` nomeado como o de maior magnitude e o único sem degrau. Se a medição da Couraça em e3.6
    mostrar resíduo de sinal, é o primeiro suspeito.
  - >-
    A loja é a dona da validação de `itemBonus`: valores finitos, dentro de `STAT_KEYS`, e o valor
    EFETIVO mostrado ao jogador calculado por `recomputeStats` sobre bola sintética — nunca por
    fórmula reimplementada no cliente (§7.3). O helper `bolaSintetica` já existe em
    `balance.ts:730` e não lê `hp`, portanto é imune a esta correção e pode ser extraído como está.
  - >-
    `def.maxHp` sobrevive em UM ponto de `src/` (`world.ts:142`, `base.maxHp`). Qualquer novo
    consumidor de `def.maxHp` que apareça em e3.1 é candidato a reintroduzir REL-001 com outra cara —
    vale como grep de revisão no gate de e3.1.

