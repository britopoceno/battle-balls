  - id: AC4
    verdict: PASS
    evidence: >-
      A regra de delta está escrita em `world.ts:183-191`, imediatamente acima da linha que a
      executa, e é FIEL a §7.4 palavra por palavra: teto que cresce dá `hp += tetoNovo - tetoAnterior`
      (delta absoluto), teto que encolhe apenas clampa `hp = min(hp, tetoNovo)`, com o registro
      explícito de que recalcular do zero curaria a bola de graça e de que o único caso vivo hoje é o
      nascimento, porque `bonusItem` é congelado na rodada e a bola é recriada a cada rodada.
      Propriedade arquitetural que a story não nomeia e que vale registrar: o nascimento **é** o caso
      degenerado da regra, não uma segunda regra — `hp = base + (stat.maxHp - base.maxHp) =
      stat.maxHp` quando o `hp` de partida é o teto sem bônus. AC 3 e AC 4 são a mesma regra aplicada
      duas vezes, e é por isso que não há divergência possível entre as duas metades.
      Julgamento sobre a escolha CREATE-como-comentário em vez de helper: correta. Um
      `aplicarDeltaMaxHp()` sem chamador seria código morto não testado dentro de `sim/`, e a story
      pede a regra escrita, não executada.

