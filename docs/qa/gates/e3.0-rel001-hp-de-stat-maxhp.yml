status_reason: >-
  Os sete ACs passam e foram verificados por reexecução independente, nada aceito do Dev Agent
  Record. O código entregue está correto e é minimalista: duas linhas de comportamento, escopo
  provado por sha256 (exatamente 1 arquivo difere do gate de e2.8; os outros 16 batem dígito a
  dígito). Golden hash idêntico nos 10 pares. Teste dirigido reescrito do zero por mim: 41
  exigências, 41 passes, com o estado PRÉ-correção reproduzido no mesmo processo para provar poder
  discriminante. As três alegações mais duras do @dev conferem na aritmética exata: `weakestEnemy`
  invertia a escolha, o Predador largava com margem ZERO a +100%, e a Casca do Golem batia
  `frac === 0.5` EXATO contra um limiar `> 0.5` estrito — o item de vida desligava a própria defesa
  do Golem. Os dois achados são de REGISTRO, não de defeito, e ambos afetam insumos de e3.1/e3.6:
  o censo extra de leitores de fração está INCOMPLETO (existe um sétimo leitor, `bot/heuristic.ts:350`
  `peso()`, que é DECISÃO e tem a maior magnitude entre os de fora de `sim/`+`chars/`), e a nota de
  robustez de NaN cita `balance.ts:287` ao contrário do que a fonte diz. Nenhum bloqueia; nenhum
  exige mudança de código. e3.1 está liberada.
