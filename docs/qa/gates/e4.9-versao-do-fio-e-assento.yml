schema: 1
story: 'e4.9'
story_title: '`net/protocolo.ts` + `net/codec.ts` — a versão do fio e o assento no `{t:''sala''}`'
gate: CONCERNS
story_status_after_gate: Done
status_reason: >-
  Os 12 ACs estão MET, e o código está correto. Conferi tudo do zero, sem confiar no Dev Agent Record.
  check, sim:check e build saíram com rc=0, e o golden hash ficou idêntico. O diff da saída inteira do
  sim:check contra um worktree de 6f2f56c^ (d378ca5) tem só a linha nova `versão fio`, além do cabeçalho
  do npm. Os dois greps de pureza deram rc=1. `git show --stat 6f2f56c` lista só os três arquivos do AC
  12, e nenhum hunk de codec.ts cai na seção ENTRADA (:28-161) nem em T_DO_SERVIDOR. Refiz os quatro
  contrafactuais do AC 10, e todos deram rc=1. Das minhas 10 mutações, 6 foram pegas, entre elas o `==`
  no lugar de `===` (o "1" passa e a guarda acusa). Fica em CONCERNS, e não PASS, por um MEDIUM de
  alcance de teste (E49-TST-001). A guarda cobre exatamente os casos mínimos do AC 10 (ausente, 0, 7,
  "30"), mas dois dos quatro termos do predicado do AC 7 (b) não têm regressão. Sem
  `Number.isInteger(hz)`, 7.5 é aceito. Sem `hz > 0`, -30 é aceito. Nos dois casos o sim:check fica
  verde. O segundo termo é o que um refactor removeria primeiro, porque `60 % 0` já dá NaN e o 0 continua
  reprovado, o que faz `hz > 0` parecer redundante. O código de hoje rejeita 7.5, -30 e 60.5 (sondado).
  Há ainda três LOW, cada um com dono.
reviewer: 'Quinn (@qa)'
