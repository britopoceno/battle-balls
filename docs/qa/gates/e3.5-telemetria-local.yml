status_reason: >-
  **Re-review após `apply-qa-fixes`.** TEL-E35-006 (bloqueante, high) está CORRIGIDO e verificado
  de forma independente: escrevi um fixture sintético NOVO (não reusei o do @dev nem o da rodada
  anterior deste gate), com 3 rodadas — uma com toques nos dois lados da tela (duas mãos esperada),
  uma com todos os toques do mesmo lado (uma mão esperada) e uma só de teclado (deve ser EXCLUÍDA do
  denominador, não contar como "duas mãos" por default). As 8 métricas (P3.1, P3.2, ambas de RF-36,
  mais os valores auxiliares) bateram exatamente com o previsto antes de rodar. Os três recomendados
  da rodada anterior (TEL-E35-001, 002, 004) também estão aplicados e verificados.
  **CONCERNS, não PASS limpo, por dois achados NOVOS de severidade baixa** encontrados durante esta
  verificação (TEL-E35-007, TEL-E35-008) — nenhum bloqueia porque nenhum é alcançável pelo cliente
  atual, mas ambos são reais e ficam registrados para não se perderem.
  `npm run check` 0 erros; `npm run sim:check` golden hash idêntico; `git diff --stat` — quatro
  arquivos, todos dentro do escopo já julgado pelo AC 13 (incluindo o desvio de `tools/telemetria.ts`,
  ainda CONCERNS pela mesma razão da rodada anterior, não reaberto aqui).
reviewer: 'Quinn (@qa) — quality_gate declarado na story'
reviewed_revision: >-
  Working tree em 2026-08-05, após a correção aplicada por `apply-qa-fixes` sobre o gate FAIL de
  2026-08-04 (`commit:eb0ef0c` + working tree). `git diff --stat` desta rodada: src/client/input.ts
  (+20/−5), src/client/main.ts (+10/−1), src/client/telemetria.ts (+27/−4),
