story: 'e2.5'
gate: CONCERNS
status_reason: >-
  Os 20 ACs passam sob verificação independente, e as três entradas obrigatórias herdadas dos gates
  anteriores (MNT-001, BOT-003, BOT-006) não só foram entregues como reproduzi cada uma do zero:
  a auditoria de roster reprova em 5 direções distintas (o @dev testou 3) sempre em ~260ms contra os
  8,3s de uma execução limpa — a reprovação é, medida, ANTES de qualquer confronto; a tabela de
  utilização de kit inteira foi reimplementada por mim de forma independente sobre exatamente as
  mesmas seeds e bate DÍGITO A DÍGITO (golem 1.75/0.75/25.0%/0.0% · 4.2s/11.7s; vex
  0.72/0.70/30.0%/32.5% · 7.1s/12.0s); e BOT-006 reproduzi por `PickSetup.itemBonus {dmg: NaN}` —
  a porta que `e2.6` vai alimentar de string — com "% sem ativa" saltando 0.0% → 50.0% no golem e
  36.7% → 50.0% no vex.
  A adaptação de §4.2 que o @dev sinalizou como o ponto que ele mais provavelmente errou está
  APROVADA, e não por deferência: "metade das DECIDIDAS" é MAIS fiel à propriedade que §4.2 exige do
  que a leitura literal "metade das seeds". §4.2 justifica o cancelamento com "as duas metades são
  amostras da mesma distribuição com o MESMO n"; sob a leitura literal, se a taxa de empate depender
  do lado as metades ficam com n_dec diferentes e o cancelamento QUEBRA. Construí exatamente esse
  cenário (lado 0 empata 60% das seeds, lado 1 nunca, time 0 sempre vence quando decide): a
  implementação do @dev dá 50,0000% exatos, e a leitura literal daria 28,57% com metades de n_dec 80
  e 200. A adaptação preserva a propriedade; a forma literal não a preservaria.
  O que segura o PASS é uma classe única de achado, e ela é de COBERTURA, não de defeito: as guardas
  permanentes do CLI cobrem veredito, aritmética de pares e contabilidade de troca de lado, e não
  cobrem a fiação entre elas nem a instrumentação de §4.5. Perturbei `icPp(nDec)` para `icPp(nSeeds)`
  — o número sobre o qual RF-48 é literalmente escrito — e as 14 asserções dos três autotestes
  passam, a tabela sai plausível e o EXIT é 0. O mesmo vale para o teto de seeds (remover
  `gastas < teto` passa tudo), para a borda superior de 45–55% e para os quatro contadores de §4.5.
  Hoje o código está correto em todos esses pontos — provei cada um por fora, inclusive um canário
  que mostra que o contador de morte súbita está VIVO (19,5% com limiar de 20s contra 0,0% com o de
  60s, mesmas 41 rodadas). O risco é para `e2.6`/`e2.7`, que é justamente onde §8.7 diz que a força
  da mutação muda a taxa de empate — e é a taxa de empate que separa `n_dec` de `n_seeds`.
