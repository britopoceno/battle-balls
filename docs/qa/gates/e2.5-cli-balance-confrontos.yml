downstream_note: >-
  `e2.6` e `e2.7` estão LIBERADAS. O instrumento que elas montam em cima existe, mede e reprova:
  a auditoria de roster barra antes de simular, o veredito tem os três estados e discrimina por n, a
  troca de lado cancela viés de lado de fato, e a instrumentação de §4.5 está verificada por
  reimplementação independente.
  Entradas OBRIGATÓRIAS que `e2.6` carrega deste gate, no mesmo formato que funcionou para MNT-001 /
  BOT-003 / BOT-006 nesta story:
  (1) QA-E25-001 — pinar `icPp` sobre `nDec` num autoteste (uma linha; o ensaio 3 já cria o estado);
  (2) QA-E25-002 — pinar o teto de seeds, que `e2.6`/`e2.7` podem de fato alcançar via §8.7;
  (3) QA-E25-006 — um autoteste de `fechar()` cobrindo os quatro contadores de §4.5.
  Entradas herdadas ainda abertas: BOT-002 (`Object.freeze` no `PRESET_ARNES`, que segue `Readonly`
  só de tipo — o cabeçalho promete "preset arnes" sem que nada garanta o conteúdo em runtime);
  `Number.isFinite` em `itemBonus` na entrada do CLI, agora com o dado novo de que `{maxHp: NaN}` NÃO
  aparece na tabela de utilização e `{dmg: Infinity}` aparece só parcialmente — a validação na raiz não
  pode ser justificada pelo detector; ARCH-002 (QA-E25-007); e o LOW aberto desde `e2.0`
  (`src/tools/inspect.ts:18` com a terceira cópia do laço e o literal `60 * 180`, fora do `sim:check`).
  Números novos, medidos pela primeira vez e confirmados por mim, que vão para o @pm: empate com o bot
  heurístico 2,8% (contra 11,1% de §1.3 e 17,5% do `dummy`); morte súbita 0,0% em 823 rodadas, máximo
  35,1s; viés de lado de `[golem,vex]` 53,00% ±3,46 (IC cruza a borda — inconclusivo, e isso é
  informação); custo ~10,3ms/rodada, que extrapola para ~6h no portão de 210 células × 10 000 de §1.1.
