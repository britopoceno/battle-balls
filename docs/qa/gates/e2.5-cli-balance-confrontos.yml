entradas_obrigatorias_dos_gates_anteriores:
  MNT-001:
    verdict: PASS
    evidence: >-
      Reproduzi a bateria do zero em cópia isolada de `src/`, com um substituidor que FALHA com
      EXIT=9 se o alvo não existir (a armadilha do `python` que o @dev registrou; meta-controle
      rodado primeiro, e ele de fato dá 9). O @dev testou 3 direções; testei 5, todas EXIT=1:
      (a) `aim.ms` 450→400 → B1; (b) `contactWindows.ms` 450→500, a outra mão → B1;
      (c) `sismico` deixa de declarar `dash` (vira `reposicao`) → B2;
      (d) `contactWindows` do golem removido inteiro (dash SEM janela) → B1, ramo que o @dev não
      exercitou; (e) `vex.lamina` ganha uma janela de contato sem ser `dash` → B2 em outro
      personagem. Em todos, `⚠ nenhuma seção de confronto impressa` e tempo de 256–307ms contra
      8332ms de uma execução limpa — a reprovação é, medida, ANTES de rodar qualquer confronto.
      Controle limpo antes e depois; `src/` real com sha256 idêntico ao início.
  BOT-003:
    verdict: PASS
    evidence: >-
      O número aparece, é plausível e é REPRODUZÍVEL por fora. Minha instrumentação independente
      sobre as mesmas seeds dá exatamente `ativa 4.2s` para o golem e `7.1s` para o vex (o CLI a
      n=823 dá 4.1s e 6.6s). A mediana é condicional a ter castado, que é o que separa kit adiado de
      kit morto — a Lâmina do Vex sai ~2,5s depois do Impacto Sísmico E com menos da metade dos casts
      (0,72 contra 1,75 por bola), confirmando a desconfiança do gate de `e2.3`. A coluna "% sem
      ativa" ao lado de "% sem ult" é acréscimo correto: o golem tem ult de `utilidade`, então só a
      coluna de ativa denuncia o caso dele.
  BOT-006:
    verdict: PASS
    evidence: >-
      Reproduzido por mim pela porta que a missão pediu — `PickSetup.itemBonus` não-finito, que é a
      superfície que o CLI de `e2.6` vai alimentar de string — e não por `hp = NaN` em `createWorld`.
      Com `{dmg: NaN}` no time 1, sobre 60 seeds: golem "% sem ativa" 0,0% → 50,0% e "% sem ult"
      32,5% → 65,8%; vex "% sem ativa" 36,7% → 50,0% e "% sem ult" 36,7% → 51,7%. Os 50,0% são
      exatamente a metade dos pares (rodada × bola), o sinal limpo que o @dev descreveu. Nenhuma
      correção extra necessária.
      ACHADO NOVO, de graça: `{maxHp: NaN}` NÃO produz o sinal (golem segue com 0,0% sem ativa) e
      `{dmg: Infinity}` produz um sinal INTERMEDIÁRIO (golem "% sem ult" 32,5% → 56,7%). Ou seja, a
      métrica captura o caminho de `dmg` e a validação de `Number.isFinite` de `e2.6` não pode ser
      justificada só por ela. Entrada para `e2.6`.

issues:
  - id: QA-E25-001
    severity: medium
    category: tests
    description: >-
      A fiação `nDec → icPp` não tem guarda. Perturbei `icPp: icPp(nDec)` para `icPp: icPp(nSeeds)`
      em `rodarConfronto` e as 14 asserções dos três autotestes passam, a tabela sai plausível e o
      EXIT é 0 — e `n_seeds` é exatamente o número sobre o qual RF-48 e §4.3 dizem que o critério NÃO
      é. O autoteste de veredito chama `vereditoDe(w, n)` direto e nunca através de `rodarConfronto`,
      então o par (winrate, n) que de fato vai para a tabela nunca é conferido. Magnitude hoje: com
      2,8% de empate, `icPp(823)` contra `icPp(800)` = 3,416 contra 3,465, erro de 0,05pp. Com os
      11,1% que §1.3 mediu, ou com o `711/800` do exemplo de §6.3, o erro vai a 0,21pp — e §8.7 diz
      explicitamente que a força da mutação muda a taxa de empate, que é a variável que separa os dois
      números. O erro subestima o IC, que é a direção que transforma `? inconclusivo` em `✓ dentro`:
      exatamente a aprovação falsa que o 3º estado existe para impedir.
    recommendation: >-
      Em `e2.6`, uma linha em `autotesteTrocaDeLado`: o ensaio (3) já produz `nDec 10 / nSeeds 15`;
      basta acrescentar `conferir('(3) IC sobre decididas', t3.res.icPp === icPp(t3.res.nDec), …)`.
  - id: QA-E25-002
    severity: low
    category: tests
    description: >-
      O teto de seeds não tem guarda de regressão. Removi `gastas < teto` da condição de
      `rodarFase` e tudo passa, porque com o roster e o bot atuais o teto nunca é alcançado. AC 9
      torna "não girar indefinidamente" critério explícito, e `e2.6`/`e2.7` vão injetar mutações que
      podem elevar muito a taxa de empate (§8.7). Um CLI que trava sem diagnóstico é o mesmo modo de
      falha que o gate de `e2.0` registrou para `runRound` sem `!world.over`.
    recommendation: >-
      Um ensaio com executor que sempre empata, afirmando `truncado === true` e
      `nSeeds === 2·ceil(n/2)·TETO_SEEDS_POR_DECIDIDA`. Rodei esse ensaio no gate e ele passa —
      é só torná-lo permanente.
  - id: QA-E25-003
    severity: low
    category: tests
    description: >-
      Cobertura assimétrica das bordas de 45–55%. `CASOS_VEREDITO` fixa a borda INFERIOR (o caso
      `w=0,45`, que reprova tanto `<` → `<=` quanto a remoção da checagem de baixo no IC), e não fixa
      a SUPERIOR: perturbar `winrate > ALVO_MAX` para `>=` passa 7/7. O comportamento real do código
      em `w = 0,55` exato está CORRETO (verifiquei: `inconclusivo`), e `440/800` é um valor
      perfeitamente alcançável — só não está pinado.
    recommendation: 'Um caso `{ n: 800, w: 0.55, esperado: "inconclusivo" }` em `CASOS_VEREDITO`.'
  - id: QA-E25-004
    severity: low
    category: code
    description: >-
      A guarda da auditoria de roster é fail-OPEN se `process.exit` não existir, ao contrário de
      `falhar()`, que é fail-closed (tem `throw new Error(msg)` depois de `sair(codigo)`). O bloco de
      `main` só chama `sair(1)`. Medido: com `process.exit` removido e o roster divergente, o CLI
      imprime "Nenhum confronto foi rodado" e em seguida roda todos os confrontos e imprime a tabela
      completa, com EXIT=0 — a frase vira mentira ao lado de uma tabela de aparência autoritativa.
      Sob `node` a condição não é alcançável, e a garantia de hoje está provada (5 perturbações,
      EXIT=1, ~260ms). O problema é de coerência: o arquivo usa `p?.exit?.()` justamente por NÃO
      assumir que `process` existe, e depois confia nessa mesma chamada como único freio.
    recommendation: 'Trocar o `sair(1)` do bloco de auditoria por `falhar(...)`, ou acrescentar o `throw` que `falhar()` já tem.'
  - id: QA-E25-005
    severity: low
    category: requirements
    description: >-
      `--comp` não valida o TAMANHO da composição. `--comp=golem` (1v1), `--comp=golem,vex,golem`
      (3v3) e uma composição de 4 rodam e imprimem tabela para um modo de jogo que não existe — o
      jogo é 2v2. O próprio CLI enuncia o princípio contrário ao rejeitar `--pacote`: "devolver uma
      tabela sem mutação nenhuma seria pior do que devolver um erro". `--comp=golem,golem`
      (tamanho 2, homogênea) deve continuar permitida: §1.2 mediu esse caso de propósito, e é o
      diagnóstico degenerado que o documento discute.
    recommendation: 'Exigir `comp.length === 2` em `lerFlags`, com mensagem citando §4.1.'
  - id: QA-E25-006
    severity: low
    category: tests
    description: >-
      A instrumentação de §4.5 e de BOT-003 não tem nenhuma guarda permanente. Passam sem detecção:
      mediana → média nos quantis de duração; denominador de "por rodada" trocado de (rodada × bola)
      para rodadas; "1º cast" registrando o ÚLTIMO cast; e o contador de morte súbita zerado — este
      último é o mais insidioso, porque o valor verdadeiro HOJE é 0,0% e um contador morto também
      reporta 0,0%. Fechei os quatro POR FORA neste gate (reimplementação independente batendo dígito
      a dígito, mais o canário de limiar 20s que dá 19,5%), mas nada disso fica no repositório. São os
      números que alimentam D-02, o Risco #6 e o detector de viés de competência de §8.3.
    recommendation: >-
      Um autoteste de `fechar()` com 3–4 rodadas sintéticas e valores esperados escritos à mão:
      pega os quatro de uma vez e custa microssegundos, como os outros três já custam.
  - id: QA-E25-007
    severity: low
    category: docs
    description: >-
      ARCH-002 (imprimir o alcance EFETIVO do dash ao lado de `maxRange`) não implementado — decisão
      ACEITA para esta story, mas a justificativa da Completion Note 9 está um pouco forte.
      `velEfetivaDash` é `function velEfetivaDash(...)` em `heuristic.ts:449`: acrescentar `export`
      é edição de efeito nulo em runtime e não pode mover o golden hash, então "exigiria editar
      `bot/`" não é o obstáculo que a nota sugere. A razão boa é a outra: `heuristic.ts` é artefato
      Done, ancorado por sha256 nos gates de `e2.3`/`e2.4`, e reabri-lo numa story de CLI custa mais
      do que rende. O custo de adiar é real e vale escrito: a tabela imprime `140–280` para o dash
      enquanto a janela de contato acaba por volta de 247px (achado do gate de `e2.2`), ou seja o
      auditor humano que MNT-001 existe para servir lê uma faixa ~12% mais larga que a que causa dano.
    recommendation: 'Fica para `e2.6`, que já vai tocar `bot/`. Não bloqueia.'

decisao_sobre_a_adaptacao_de_4_2:
  questao: '"metade das SEEDS" (literal de §4.2) contra "metade das DECIDIDAS" (implementado)'
  veredito: APROVADA
  raciocinio: >-
    §4.2 não pede a forma pela forma: ela justifica o cancelamento com "as duas metades são amostras
    da mesma distribuição com o MESMO n". Sob a leitura literal esse "mesmo n" é o número de SEEDS, e
    o denominador do winrate é o de DECIDIDAS (§4.3) — as duas metades entram no estimador com pesos
    diferentes assim que a taxa de empate depender do lado, e a condição que §4.2 invoca deixa de
    valer. A implementação do @dev faz as metades terem exatamente o mesmo número de DECIDIDAS, que é
    a leitura que torna a frase de §4.2 verdadeira.
  prova: >-
    Cenário construído por mim, com a partida substituída por um executor roteirizado: lado 0 empata
    60% das seeds, lado 1 nunca empata, o time 0 sempre vence quando decide (viés de lado PURO).
    Implementado: 50,0000% exatos, n_dec 400, n_seeds 700. Leitura literal (200 seeds por metade):
    28,57%, com metades de n_dec 80 e 200. O viés puro só cancela na versão implementada.
  nao_enviesamento_do_estimador: >-
    A regra de parada olha apenas o indicador DECIDIDA/EMPATE, nunca o vencedor: as `k` rodadas
    decididas de cada metade são `k` ensaios de Bernoulli i.i.d. na probabilidade condicional
    "C0 vence | decidiu", logo `V_i ~ Binom(k, p_i)` exatamente e `E[(V0+V1)/2k] = (p0+p1)/2`.
    Amostragem inversa não introduz viés aqui. Confirmado numericamente: cenário com p0 = 0,9 e
    p1 = 0,7 (viés de lado de 20pp) converge para 80,00%, a média verdadeira.
  ressalva: >-
    As duas metades usam seeds DIFERENTES (a 2ª retoma onde a 1ª parou), como na forma literal.
    Um desenho pareado (mesma seed nos dois lados) cancelaria mais variância, mas §4.2 não o pede e
    trocá-lo agora seria decisão de arquitetura, não de story. Registrado, sem ação.

independent_verification:
  ambiente: >-
    Nada foi assumido. `node --version` → v24.13.1, conferido antes de qualquer coisa. Todos os
    testes rodaram em Node/bash reais. O substituidor da bateria FALHA com EXIT=9 se o alvo não
    existir ou for ambíguo, e rodei um meta-controle com alvo inexistente primeiro, que de fato deu
    9 — a armadilha do `python` que o @dev registrou (e que o gate de `e2.2` já tinha registrado)
    não se repetiu, e não por sorte.
  isolamento: >-
    Toda perturbação em cópia de `src/` no scratchpad. Fingerprint sha256 da árvore `src/` real
    (20 arquivos, conteúdo + caminho) tomado antes de tudo e recomputado ao fim:
    `861d376b8532cfc88f32d3832702b8146841b28db6570dd686fba8f5112290b4` nos dois — `src/` real
    intocado por este gate.
  execucoes_proprias: >-
    `npm run check` EXIT=0 e `npm run sim:check` EXIT=0 no início e no fim. `npm run balance` padrão
    reproduzido do zero, batendo o relato do @dev linha por linha (800 dec / 823 seeds / 53,00% ±3,46,
    2,8% de empate, 0,0% de morte súbita, 8,3s). `--plano=pares-de-composicao --n=20` → 20/20/65,00%,
    idêntico ao relatado.
  troca_de_lado: >-
    Dirigi as funções REAIS de `balance.ts` a partir de um prefixo byte-idêntico do arquivo (corte na
    marca `main`, sem tocar em nenhum corpo de função), com executores roteirizados meus. 13 ensaios,
    todos passando: viés puro cancela em 4 valores de n; metades com n_dec idêntico inclusive com n
    ímpar; empate assimétrico por lado (o caso decisivo, ver `decisao_sobre_a_adaptacao_de_4_2`);
    vantagem de composição íntegra nos dois sentidos; mistura de viés + vantagem converge para a média
    verdadeira; espelho preserva 73,15% de viés bruto; empate consome seed e não entra no denominador;
    seeds contíguas; teto de seeds respeitado ao seed exato.
  bateria_negativa_propria: >-
    17 perturbações em `balance.ts`, escolhidas para atacar as METADES que a bateria de 8 do @dev não
    cobre. 11 DETECTADAS (EXIT=1, nenhuma tabela impressa): `ceil` → `floor` na metade; 2ª metade
    reiniciando na seed base; z 1,96 → 1,645; vitória sempre para o time 0; espelho sempre falso;
    espelho sempre verdadeiro; empate deixa de ser pulado; borda inferior `<` → `<=`; IC só olhando a
    borda de cima. 6 NÃO detectadas, que são os achados QA-E25-001, 002, 003 e 006. Controle limpo
    antes e depois.
  reimplementacao_independente: >-
    Reescrevi do zero a tabela de utilização e os quantis de §4.5 — instrumentação própria sobre
    `runRound`, sem usar `anotar`/`fechar` — e rodei sobre exatamente as mesmas seeds. 14 grandezas,
    14 iguais dígito a dígito. É a verificação que fecha AC 13 e BOT-003 sem depender do código
    revisado.
  canario_de_metrica_viva: >-
    Trocar `SUDDEN_DEATH_MS` por 20000 no comparador faz o mesmo conjunto de 41 rodadas reportar
    19,5% em vez de 0,0%. O contador de Risco #6 está vivo; o 0,0% é medição.

