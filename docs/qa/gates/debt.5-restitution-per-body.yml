    `média` 0.7000000000, `produto` 0.4500000000, `geométrica` 0.6708203932 e `mínimo`
    0.5000000000. Repetido com os valores invertidos (golem 0.9, vex 0.5): e = 0.9 de novo, logo a
    regra é simétrica e não é "usa sempre o do primeiro/segundo corpo".
  no_mixing_walls: >-
    Medido, não só lido. Duas bolas com restWall diferentes (0.11 e 0.9) no MESMO passo:
    `collideWalls` devolveu vx = 11 e vx = 90 sobre v = −100 — cada corpo com o próprio fator, sem
