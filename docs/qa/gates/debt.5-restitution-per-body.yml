  Os 9 ACs estão cumpridos e a regra de combinação foi provada — não aceita da Debug Log, mas
  medida: com `restBall` 0.5 vs 0.9 em bolas reais, o `e` recuperado da colisão é 0.9000000000
  exato, batendo MÁXIMO e descartando média (0.70), produto (0.45), geométrica (0.6708) e mínimo
