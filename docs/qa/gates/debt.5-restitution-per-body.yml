top_issues:
  - id: 'QA-001'
    severity: low
    finding: >-
      Refactor não pedido com efeito silencioso: mover `...DEFAULT_STATS` para o TOPO do literal de
      `base` mudou a ordem de inserção de chaves do objeto. Antes, `base` era construído em
      maxHp,radius,mass,maxSpeed,steer,drag + spread — ordem IDÊNTICA a `STAT_KEYS` e, portanto, à
      forma que `makeStatBlock` dá a `stat`/`bonusPassive`/`bonusItem`. Agora `base` é
      restBall,restWall,dmg,...,knockbackTaken,maxHp,...,drag: mesmas 14 chaves, forma diferente.
      Isso contraria a intenção que `stats.ts:71` declara em voz alta ("as 14 chaves em forma fixa
      — mesma hidden class no V8"), num objeto lido chave a chave por `recomputeStats` a cada bola
      a cada tick (o alvo de 40M ticks do arnês da Fase 2 é justamente o que §7.1 protege).
      Medido: microbenchmark de `recomputeStats` com as duas ordens deu delta de 0,66% em 4M
      chamadas × 2 rodadas alternadas — dentro do ruído. Ou seja, HOJE não custa nada; o defeito é
      a deriva entre o que o código documenta querer e o que ele faz, deixada sem nota.
    suggested_action: >-
      Correção de custo zero e sem risco: manter `...DEFAULT_STATS` DEPOIS dos 6 campos do CharDef
      (como era) e colocar `restBall: def.restBall ?? ...` / `restWall: ...` como as ÚLTIMAS linhas
      do literal. Reatribuir uma chave já existente não muda a posição dela, então a ordem volta a
      bater com STAT_KEYS e o override continua vencendo. Alternativa igualmente válida: manter
      como está e trocar o comentário de `stats.ts:71` por uma nota dizendo que `base` não
      compartilha a forma dos demais blocos, deliberadamente.

  - id: 'ARCH-001'
    severity: low
    finding: >-
      A regra MÁXIMO não tem nenhuma cobertura versionada. `determinism.ts` — inclusive a tabela de
      cobertura de build acrescentada em 06a927e — só exercita bolas com `restBall` igual (0.65),
      e com valores iguais MÁXIMO, MÍNIMO, MÉDIA e MÉDIA GEOMÉTRICA devolvem todas 0.65: o golden
      hash só conseguiria flagrar a troca por PRODUTO. Ou seja, o hash idêntico prova que o
      comportamento não mudou, mas não prova qual das quatro regras foi escrita. A prova de que é
      `max` é o harness que este gate rodou FORA do repositório. Enquanto nenhum item existir, isso é inerte; a partir do passo 8 (agregação de
      item), a Borracha torna a regra viva e um refactor futuro — incluindo a alavanca `√(ea·eb)`
      que a própria story registra como reversível — não encontra teste nenhum no caminho.
    suggested_action: >-
      Na story de itens (passo 8), acrescentar um caso ao arnês com dois `restBall` diferentes e
      asserção sobre o valor combinado. Não é trabalho desta story.

  - id: 'PROC-001'
    severity: low
    finding: >-
      As 6 Tasks / 13 subtasks da story continuam todas `[ ]` desmarcadas, apesar de a
      implementação estar completa e a story ter ido para InReview. É a regra de
      story-lifecycle ("Update progress — mark checkboxes as tasks complete"). O @qa não tem
      autoridade para marcá-las (só Status/QA Results/Change Log), então ficam como estão.
    suggested_action: >-
      @dev marca as caixas ao fechar a próxima story. Sem impacto em código.

scope_judgments:
  spread_reorder:
    verdict: NECESSÁRIO, MAS NÃO DA FORMA ESCOLHIDA
    reasoning: >-
      Alguma reordenação era obrigatória: com `...DEFAULT_STATS` no fim, uma linha
      `restBall: def.restBall ?? ...` colocada antes dele seria sobrescrita pelo default e o
      override do CharDef nunca funcionaria — o bug exato que o item 6 da revisão procurava. O @dev
      viu isso corretamente. A escolha de mover o spread para o topo resolve, mas era a única das
      duas soluções que muda a forma do objeto (ver QA-001); pôr as duas linhas no fim resolveria
      igual sem efeito colateral.
  zone_wall_without_own_stat:
    verdict: ESCOPO CORRETO
    reasoning: >-
      `Zone.restitution` como identidade do Golem está registrado em architecture.md §2.3 como
      espaço de design NÃO usado em v1. A implementação usa `b.stat.restWall` puro, sem tentativa
      de mixing, exatamente como as duas linhas da tabela de casos de borda exigem. Confirmado por
      medição, não só por leitura.
  max_rule_choice:
    verdict: FIEL À DECISÃO DE ARQUITETURA
    reasoning: >-
      `Math.max`, com o comentário em physics.ts:61-63 nomeando a razão (o item não pode depender
      da build do inimigo) e apontando para §2.2. O contra-argumento honesto fica onde deve ficar —
      registrado nas Dev Notes como alavanca reversível para a Fase 2 — e NÃO foi implementado,
      como a story manda.

