  spread_reorder_is_behavior_neutral: >-
    A reordenação (`...DEFAULT_STATS` passou de último para primeiro) NÃO regride os 6 stats vindos
    do CharDef: `DEFAULT_STATS` é um `Pick` de 8 chaves disjuntas das 6 do CharDef, então nunca
