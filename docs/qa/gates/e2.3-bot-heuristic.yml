      SHA256 (`80dcd986...`) antes e depois, com `npm run check` EXIT=0 no fim.
      Registro do limite, medido na mesma passada: uma segunda linha com cast explícito
      (`(view as unknown as { rng: () => number }).rng()`) compila sem erro. É a ressalva que
      `types.ts:172-176` já declara (`Omit` é raso) e o motivo de §3.3/N-3 delegar a proteção real ao
      teste de replay de `e2.4` — não é regressão desta story, é o contrato conhecido.
