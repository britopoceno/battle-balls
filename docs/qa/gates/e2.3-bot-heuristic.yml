schema: 1
story: 'e2.3'
gate: CONCERNS
status_reason: >-
  Os 24 ACs passam sob verificação independente. Bateria própria de 60+ checks em dois scripts de
  scratchpad (nada reaproveitado do Dev Agent Record): streams de PRNG conferidos contra
  `mulberry32(deriveSeed(seed,1|2))` valor a valor, ordem de saque de §3.2 medida por instrumentação
  do `rand`, N-3 provado por comparação de snapshot JSON do mundo inteiro antes/depois de cada
  `botCommands` ao longo de 900 ticks, e simetria RF-45 provada num estado NÃO-vacuo com mundo
  refletido 180°. A matemática de ARCH-001 foi derivada e reconferida por três caminhos
  independentes e está CORRETA — a decisão do @dev é engenharia sólida, sem objeção. O achado da
  Lâmina Fantasma reproduz-se exatamente (`pAcerto` máximo = 0,5). Golden hash idêntico, e verificado
  que as tabelas `BASELINE`/`BUILD_BASELINE` não foram movidas.
  CONCERNS por um achado próprio deste gate, não presente no relato: existe UM caminho em que um
  denominador não conferido atravessa o limiar de decisão em vez de ser barrado por ele (BOT-001), e
  ele é alcançável de ponta a ponta a partir da porta que `e2.1` abriu. Não bloqueia — ver
  `blocking`.
