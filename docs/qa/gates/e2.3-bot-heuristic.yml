acceptance_criteria:
  - id: AC1
    verdict: PASS
    evidence: >-
      `botCommands` devolve `Command[]` e o tipo de retorno não admite outra coisa. A afirmação forte
      — "e nada mais" — foi provada em runtime, não por leitura: comparei `JSON.stringify` do mundo
      inteiro (menos funções) imediatamente antes e depois de cada chamada de `botCommands`, para os
      dois bots, ao longo de uma partida completa de 900 ticks. Zero divergências. O bot não move
      bola, não dispara básico, não escreve estado nenhum na simulação.
  - id: AC2
    verdict: PASS
    evidence: >-
      Os seis símbolos exportados existem com as assinaturas de §2.7 (`heuristic.ts:31,40,64,90,97,113,159`).
      A recusa de `.rng()` foi reproduzida por mim, não aceita do relato: inseri `void view.rng()` em
