independent_verification:
  metodo: >-
    Dois scripts próprios em scratchpad, importando `src/` por `file://` — `src/` real tocado uma
    única vez, para o teste negativo de `WorldView`, e restaurado byte-idêntico (SHA256 conferido).
    60+ asserções. Nenhum número do Dev Agent Record foi aceito sem recomputação.
  streams_prng:
    detail: 'igualdade de sequência contra mulberry32(deriveSeed(...)), sobreposição deslocada, varredura de colisão'
    result: >-
      team0 ≡ stream 1, team1 ≡ stream 2, nenhum ≡ stream 0. Zero sobreposição em 150 offsets. Zero
      colisão de `deriveSeed` em 5 000 seeds × streams 0/1/2. `deriveSeed(12345, 0|1|2)` =
      2258480790 / 3283241497 / 613117429.
  partida_real_dois_bots:
    detail: >-
      Três seeds com `heuristic` nos DOIS lados, laço manual conferido contra `runRound` do harness.
      Os comandos de cada time gravados separadamente e comparados.
    result: >-
      seed 1 → winner 0 · 827 ticks · hash adc82769 (t0 emite 3 comandos, t1 emite 4); seed 2 →
      winner 0 · 1159 ticks · c304f0c2 (4 / 5); seed 3 → winner 1 · 766 ticks · f899b3ad (3 / 4). Em
      todas, `comandos(t0) != comandos(t1)` — os streams estão de fato separados, não só no código.
      Laço manual ≡ `runRound` nas três. Autoconsistência (seed 7 rodada duas vezes): 6c272a56 ≡
      6c272a56 — prévia do P2.5 que `e2.4` vai formalizar.
  arch_001_matematica:
    veredito: 'CORRETA. Decisão de engenharia sólida, sem objeção.'
    detail: >-
      Derivei do zero em vez de conferir. `physics.ts:18` roda `k = Math.pow(drag, dt); v *= k` por
      tick, e `drag^dt` composto n vezes é `drag^(n·dt)` — logo `v(t) = v0·drag^t` EXATAMENTE, não
      por aproximação. A média temporal em [0,T] é `(1/T)∫v0·drag^t dt = v0·(1−drag^T)/(T·(−ln drag))`,
      que é linha por linha a fórmula de `velEfetivaDash` (`:442`). A forma está certa.
    numeros_recomputados:
      - 'analítico, golem (drag 0.3 de golem.ts:22, T = 450/1000): v̄ = 694.85 px/s = 77.21% de 900 — bate os 694.9 / 77.2% que o @dev alega'
      - 'integração discreta reproduzindo o laço EXATO de physics.ts (27 ticks a 1/60): 687.91 px/s = 76.4%. A integral contínua fica 1.00% acima da soma de Riemann à direita — o desvio de dt/2, irrelevante num estimador heurístico'
      - 'medição REAL num mundo em execução, com a IA de movimento no laço: 543.22 px/s = 60.4% (o gate de e2.2 mediu 550 px/s = 61.1% com outro setup — mesma ordem, confirma)'
      - 'tImpacto a 280px: cru 0.311s · corrigido 0.403s · real 0.515s. Erro cai de −39.6% para −21.7%'
      - "fidelidade do 'raio' do Vex medida por mim: 620.0 px/s de 620 declarados = 100.0% (ver BOT-005)"
    ordenacao_verificada: >-
      `real (543) < modelado (695) < declarado (900)`. Isto é o que importa e foi testado como
      asserção: a correção anda NA DIREÇÃO da realidade sem ultrapassá-la, e o resíduo continua sendo
      otimismo (o bot ainda acha que chega antes do que chega), não vira pessimismo. O sinal do erro
      não inverteu.
    julgamento: >-
      Aprovo a escolha. Ela usa só dado já declarado (`S.ms` de `AimSpec`, `self.stat.drag` do
      `WorldView`), não toca `sim/`, deriva da lei que o motor de fato roda, e degrada para `S.speed`
      fora do domínio em vez de produzir NaN. Uma constante calibrada a 0.61 seria um número por
      personagem disfarçado de fórmula — a opção C de §2.2 entrando pela porta dos fundos — e
      envenenaria qualquer personagem futuro com `drag` diferente. O @dev nomeou esse risco antes de
      mim e escolheu certo. Bônus registrado: resolve metade de REQ-001 (o gate de e2.2 apontou que
      `dash.ms` não tinha consumidor na política escrita; agora tem).
  invariantes_n1_n4:
    N1: 'zero Date.now/performance.now/process.hrtime/Math.random — só 3 comentários que os citam'
    N2: 'porBola tocado só em estadoDe, por chave; zero for..in / for..of / Object.keys sobre ele'
    N3: 'snapshot JSON do mundo inteiro, antes vs depois de cada botCommands, 900 ticks, 2 bots — zero divergências'
    N4: 'zero Math.hypot, zero Math.atan2; cos/sin 1× (jitter) e log/pow 1× (velEfetivaDash), ambos aceitos por §8.5'
  guardas_rel_002:
    detail: 'cada guarda exercitada com o estado degenerado que ela existe para barrar'
    result: >-
      distância zero (bolas sobrepostas) → comandos finitos; `maxHp = 0` → finitos; `maxHp = NaN` →
      barrado pelo `!(x>0)` corretamente; `raioEf = 0` com sigma 0 (o 0/0 literal) → finitos;
      `drag` em {0, 1, −0.5, 1.5} → finitos nos quatro (degrada para `S.speed`); `DECAIMENTO_MS = 0`
      num preset customizado → sem −Infinity; posição do alvo = NaN → a rede de finitude de `emitir`
      segura e nenhum comando sai. A forma `!(x > 0)` está de fato usada nos quatro pontos que o @dev
      declara e ela de fato barra NaN. Um quinto ponto ficou de fora — BOT-001.
  lamina_fantasma:
    detail: 'recomputado analiticamente E reproduzido no bot, sem reusar o número do relato'
    result: >-
      Confirmado exatamente. Lâmina: `minRange = maxRange = 200`, `aim.radius = 9`. Contra outro Vex
      (`radius 15`): `raioEf = 24`; o melhor caso possível (alvo parado, mira exata, alvo exatamente
      no alcance) zera dois dos três termos de sigma e deixa `sigma = JITTER_RAD·dPrev = 0.12·200 =
      24`. `pAcerto = 24²/(24²+24²) = 0.5`, exato até o último bit. Contra Golem (`radius 24`):
      `raioEf = 33` → 0.6541. Verificado no bot real: 1v1 vex-vs-vex, alvo cheio a d=200 → NÃO casta.
    ressalva: 'ver BOT-003 — o número está certo, a conclusão que o @dev tirou dele está ampla demais'

top_issues:
  - id: 'BOT-001'
    severity: medium
    category: reliability
    finding: >-
      Achado próprio deste gate, ausente do relato. A disciplina `!(x > 0)` foi aplicada a quatro
      denominadores, mas o QUINTO ponto onde um NaN decide é o próprio limiar — e lá a mesma
      propriedade ("toda comparação com NaN é falsa") age no sentido INVERSO: em vez de barrar, deixa
      passar. `porValorEsperado` fecha com `if (melhor === null || melhorVE < limiar) return null`
      (`heuristic.ts:277`). Com `melhorVE = NaN`, `NaN < limiar` é `false` e o candidato é ACEITO.
      A cadeia: `peso` (`:334-340`) guarda `!(e.stat.maxHp > 0)` mas não guarda `e.hp` — com
      `hp = NaN`, `frac` é NaN, o clamp ternário `frac > 1 ? 1 : frac < 0 ? 0 : frac` cai no ramo
      final (as duas comparações são falsas) e devolve NaN; `peso` vira NaN; `VE` vira NaN; o limiar
      não segura. O comando emitido é FINITO (a geometria está sã), então a rede de `emitir` também
      não pega. Medido: alvo a 900px com `hp` normal → 0 comandos, correto; o mesmo mundo com
      `hp = NaN` → 1 comando, `{dx:0.9935, dy:0.1134, mag:0.9399}`. O bot casta onde não castaria.
    alcancabilidade: >-
      Não é hipótese de laboratório — segui o caminho inteiro e ele fecha. `PickSetup.itemBonus`
      (entregue por `e2.1`, e a porta que o CLI de `e2.6` vai alimentar a partir de string de linha de
      comando) aceita `{ dmg: NaN }` sem validação; `recomputeStats` propaga e `stat.dmg` sai NaN;
      80 ticks depois, `hp` de uma bola é NaN. Reproduzido nesta revisão.
    atenuantes: >-
      Três, e são substanciais. (1) Um `hp = NaN` já é estado corrompido em que a bola é imortal
      (toda comparação de morte falha) e a rodada bate o teto de 180s — anomalia que a instrumentação
      de morte súbita de §4.5 (Risco #6) já vai imprimir, então a célula afetada não passa silenciosa.
      (2) O bot não é a ORIGEM do NaN e não o propaga para dentro da simulação. (3) Nenhum AC de e2.3
      exige isto: REL-002 é Should-Fix herdada de `e2.1`, advisory, e o @dev cobriu os quatro pontos
      que enumerou.
    scope_verdict: >-
      Não reprova a story. É lacuna de completude numa mitigação já reivindicada, não AC falhado, e o
      @dev inclusive nomeia corretamente que "o parser do CLI (e2.6) continua sendo o dono do problema
      no outro sentido". Este gate acrescenta que a metade do bot tem um ponto a mais do que os quatro
      mapeados.
    suggested_action: >-
      (a) `e2.4`, uma linha: trocar `melhorVE < limiar` por `!(melhorVE >= limiar)`, que fecha o
      ponto com a MESMA idiomática já adotada no arquivo, e clampar `frac` em `peso` contra NaN
      (`if (!(frac >= 0)) return 1`). É onde cabe porque `e2.4` põe o bot no laço e pode provar a
      guarda por teste. (b) `e2.6`: validar `itemBonus` na entrada do CLI — `Number.isFinite` em cada
      campo, com erro explícito. É o dono de raiz. (c) registrar em `e2.1` que REL-002 tinha alcance
      maior do que aquela story escopou.
  - id: 'BOT-002'
    severity: low
    category: maintainability
    finding: >-
      `PRESET_ARNES` é `Readonly<BotConfig>` — apagado em runtime. Medido: `PRESET_ARNES.PISO_LIMIAR =
      0.99` MUTA o objeto exportado, sem `Object.freeze`. O AC 13 pede "Readonly" e §2.7 escreve
      literalmente `Readonly<BotConfig>`, então a letra está cumprida e por isso o AC é PASS. Mas §8.4
      ("deriva de preset") declara a mitigação do risco como "`PRESET_ARNES` é `Readonly` e
      **congelado por `BOT_VERSION`**" — e uma matriz reportada sob `heuristic-1` depois de alguém ter
      escrito num campo do preset seria exatamente a falha que §6.3 existe para impedir, sem nenhum
      sinal. `e2.5`/`e2.6` são as stories que vão manipular flags perto deste objeto.
    scope_verdict: 'não reabre e2.3 — o AC está atendido como escrito'
    suggested_action: >-
      `e2.5`: `export const PRESET_ARNES = Object.freeze({ ... LIMIAR: Object.freeze({...}) })`
      (freeze é raso, `LIMIAR` precisa do seu). Custo zero, e transforma uma promessa de tipo numa
      garantia de runtime bem no ponto em que o CLI começa a existir.
  - id: 'BOT-003'
    severity: low
    category: requirements
    finding: >-
      O número do @dev está certo e o achado é real, mas a conclusão é mais ampla do que o dado
      sustenta. Reproduzi `pAcerto` máximo = **exatamente 0,5** contra outro Vex, e 0,6541 contra
      Golem. Porém a Completion Note 5 afirma que "o limiar base `LIMIAR.ability = 0,55` é
      **inalcançável**", e isso confunde `pAcerto` com `VE`: §2.4 define `VE = Σ pAcerto·peso`, e
      `peso ∈ [1, 2]`. Medi a fronteira: alvo a 95% de hp → VE 0.525, espera; alvo a **90%** de hp →
      VE 0.550, **CASTA**. Ou seja, a Lâmina destrava assim que o alvo perde ~10% de vida — e em 2v2
      o somatório sobre dois inimigos destrava antes ainda. O próprio dado do @dev confirma: o Vex
      castou 2 vezes em 827 ticks, não zero.
    porque_importa: >-
      A formulação correta é mais interessante que a original para `e2.5`, não menos. Não é "kit
      morto"; é **kit adiado**: no espelho Vex-vs-Vex a Lâmina fica estruturalmente indisponível
      enquanto ninguém está ferido, e portanto acoplada ao progresso da luta em vez de disponível
      desde o início. Isso é viés de competência do bot emergindo SEM nenhum ramo por personagem —
      exatamente o que §8.3 prevê e o que a métrica de utilização de kit de §6.3 tem que capturar. E
      é achado de `e2.5`, não defeito desta story: §2.6 proíbe mexer em `PRESET_ARNES` sem dado, e o
      @dev acertou em não mexer.
    suggested_action: >-
      `e2.5`: a métrica de utilização de kit deve reportar, além de "casts por rodada" e "% de rodadas
      sem ult", o **tick mediano do primeiro cast de cada slot**. É esse número que separa "kit morto"
      de "kit adiado", e a Lâmina no espelho Vex é o primeiro caso concreto que o projeto tem para
      calibrá-lo.
  - id: 'BOT-004'
    severity: low
    category: architecture
    finding: >-
      Observação sobre a forma da correção de ARCH-001, registrada para não se perder — não é defeito.
      `tImpacto = d / v̄` com `v̄` calculado sobre a janela DECLARADA inteira (`S.ms`) é independente
      de `d`. Como a velocidade real parte de 900 e decai, o tempo real para percorrer um `d` curto é
      MENOR que `d/v̄`, e para um `d` próximo do alcance máximo é maior. O inverso exato da lei de
      posição seria `t = −ln(1 − d·(−ln drag)/v0) / (−ln drag)`. Não recomendo trocar: a forma linear
      em `d` é a de §2.3, o termo alimenta `sigma` (onde superestimar é conservador, e conservador é
      o que §2.3 escolhe deliberadamente com `|v_e|`), e a exata introduz um domínio de validade novo
      (o argumento do log pode ficar negativo para `d` além do alcance do dash) que precisaria da sua
      própria guarda.
    suggested_action: 'nenhuma ação. Registrado para o @architect no dia em que §2.3 for revisada.'
  - id: 'BOT-005'
    severity: low
    category: process
    finding: >-
      Correção de um número que este gate herdou do gate de `e2.2` e que o @dev reutilizou de boa-fé.
      Medi a velocidade do projétil da Lâmina isolando o deslocamento puro ao longo de 30 ticks:
      **620.0 px/s de 620 declarados = 100.0%**, não os 98,2% (609 px/s) registrados em e2.2. Aquele
      número veio de dividir o alcance TOTAL medido (578,7px) pela vida do projétil, e o alcance total
      embute o deslocamento de spawn (`self.stat.radius`) e um tick final truncado. Projétil não sofre
      `drag` — a fidelidade é exata por construção.
    consequencia: >-
      Nenhuma sobre a decisão. Torna a assimetria ligeiramente MAIOR do que o @dev reporta (≈22pp em
      vez de 21pp após a correção, ≈40pp em vez de 37pp antes), isto é, os números dele são
      conservadores na direção certa e a conclusão fica mais forte, não mais fraca.
    suggested_action: '@architect/@qa: usar 100% (não 98,2%) como fidelidade de referência do `raio` em §6.3.'

design_decisions_reviewed:
  - decision: 'ARCH-001 corrigido por integral do decaimento, não por constante calibrada'
    verdict: 'CORRETO — engenharia sólida, matemática verificada por três caminhos, sem objeção'
    rationale: >-
      Ver `independent_verification.arch_001_matematica`. A forma é a integral exata da lei que
      `physics.ts:18` roda, não uma aproximação inventada; usa só dado já declarado; degrada em vez de
      produzir NaN; e não introduz nenhum número por personagem. A alternativa (fator 0.61) teria
      reintroduzido a opção C rejeitada em §2.2 disfarçada de fórmula. O resíduo é a IA de movimento,
      e o @dev está certo em não modelá-la: RF-12 a torna autoral e lê-la seria desfazer o motivo de
      `AimSpec` existir.
  - decision: '`EstadoBola` fica { proximaDecisaoTick, prontoDesdeUlt } — a ativa não ganha memória'
    verdict: 'correto, e resolve o Should-Fix do @po pela raiz'
    rationale: >-
      `self.abilityReadyAt` (`types.ts:58`) É o instante exato em que o cooldown terminou, e está no
      `WorldView`. Copiá-lo para `EstadoBola` criaria uma segunda fonte de verdade para um número que
      já existe — o pecado C3 pelo qual este projeto já pagou duas vezes. Verifiquei o caso de borda
      que o @dev cita: no tick 0, `abilityReadyAt = 0` dá `esperaMs = view.time`, que é a semântica
      certa (a ativa está disponível desde o começo). A ult de fato não tem campo equivalente
      (`ultCharge`/`ultThreshold` são um limiar, não um instante), e é a única que ganha memória.
      O atraso de observação de até ~250ms sobre uma escala de 8 000ms é 3%, igual para os dois times,
      e o @dev o registrou em vez de escondê-lo.
  - decision: '`erroAlcance` (§2.3) implementado como `erroMira`, sua generalização'
    verdict: 'correto — é a única leitura que faz §2.3 e §2.4 coexistirem'
    rationale: >-
      §2.3 define o termo só para o inimigo mirado; §2.4 soma sobre todos. Sem generalizar, o
      somatório fica indefinido para quem não é o alvo. `dist(pontoDeImpacto, prev(e))` reduz-se
      exatamente a `|dPrev − alcanceEf|` no caso de §2.3 (o ponto de impacto está sobre o raio até o
      alvo), então nenhuma palavra de §2.3 deixa de valer. O @dev registrou a divergência em vez de
      deixá-la implícita, que é o comportamento certo para uma linha de arquitetura.
  - decision: 'ponto de impacto derivado de `mag`, e não `mag` derivado da distância clampada'
    verdict: 'correto, e por um motivo melhor do que parece'
    rationale: >-
      `direcionado` (`:537-540`) usa `alcance = min + (max−min)·mag`, que é literalmente `aimFrom`
      (`world.ts:422`). O ponto que o bot AVALIA é assim, por construção, o ponto que o motor vai
      CALCULAR. Clampar a distância direto divergiria quando `maxRange < minRange` — configuração que
      nenhum personagem declara hoje, o que é exatamente por que ninguém notaria.
  - decision: 'BOT_VERSION mantido em heuristic-1 apesar da correção de ARCH-001'
    verdict: 'correto'
    rationale: >-
      O AC 2 fixa a string, e nenhuma matriz foi produzida ainda — não existe resultado anterior de
      que esta correção divirja. `BOT_VERSION` existe para separar matrizes comparáveis de
      incomparáveis; sem matriz emitida, não há o que separar. Incrementar agora gastaria a versão
      sem informação.
  - decision: 'desempate por `id` em porValorEsperado e maisProximo, redundante com a ordem de view.balls'
    verdict: 'correto — redundância barata e deliberada'
    rationale: >-
      Como `view.balls` está em ordem crescente de `id` e a invariante de `world.balls` proíbe
      reordenar, `alvo.id < melhorId` nunca dispara hoje: o primeiro (menor id) vence os empates. É
      exatamente o comportamento que §3.3 pede, e a linha continua sendo a proteção que sobra no dia
      em que alguém violar a invariante. O @dev comentou a redundância em vez de deixá-la parecendo
      código morto.
  - decision: 'CodeRabbit não executado'
    verdict: 'aceito — limitação de máquina, como em debt.*, e2.0, e2.1 e e2.2'
    rationale: >-
      WSL ausente. Substituído por `npm run check`, `npm run sim:check`, greps de fronteira e — o que
      de fato importa aqui — 60+ asserções independentes deste gate sobre comportamento em runtime,
      que é a categoria que o CodeRabbit não cobriria de qualquer forma num arquivo cujo único risco
      real é fórmula errada.

