  stories Done e não commitadas — e2.0 (`tools/harness.ts` novo + `tools/determinism.ts`), e2.1
  (`sim/world.ts`), e2.2 (`sim/types.ts`, `chars/golem.ts`, `chars/vex.ts`) e e2.3
  (`src/bot/heuristic.ts`, arquivo novo e único delta). São quatro commits distintos, nessa ordem;
