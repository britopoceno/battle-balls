downstream_note: >-
  `e2.4`, `e2.5`, `e2.6` e `e2.7` estão LIBERADAS. O bot compila, é determinístico entre execuções,
  não escreve no mundo, saca do stream certo na ordem certa e joga os dois lados com o mesmo código —
  que é a fundação inteira de que as quatro dependem.
  Entradas obrigatórias herdadas deste gate: `e2.4` leva BOT-001 (o limiar aceita `VE = NaN`; a
  correção é de uma linha e `e2.4` é onde ela fica testável, com o bot no laço); `e2.5` leva BOT-002
  (`Object.freeze` no preset, antes de o CLI existir) e BOT-003 (a métrica de utilização de kit de
  §6.3 precisa do tick mediano do primeiro cast, não só da contagem — a Lâmina no espelho Vex é o
  caso de calibração); `e2.6` leva a metade de raiz de BOT-001 (validar `itemBonus` com
  `Number.isFinite` na entrada). ARCH-001 está ENCERRADO: tratado, verificado e aprovado.
