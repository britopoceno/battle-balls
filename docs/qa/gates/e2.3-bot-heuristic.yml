    verdict: PASS
    evidence: >-
      Auditei TODAS as 11 ocorrências de `team` e as 2 de `charId` em `heuristic.ts`, uma a uma.
      `team` entra em exatamente os dois pontos permitidos: `:121` (`deriveSeed(matchSeed, team + 1)`
