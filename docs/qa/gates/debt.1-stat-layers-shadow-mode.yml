top_issues:
  - id: 'REQ-001'
    severity: low
    finding: 'O texto do AC5 continua declarando `recomputeStats(base, bonusPassive, bonusItem): StatBlock` (função pura), enquanto o código entrega `recomputeStats(b: Ball): void`. A resolução é tecnicamente correta e foi autorizada pelo Should-Fix do @po no Change Log; está documentada em três lugares (Change Log, Completion Notes e comentário de 10 linhas no próprio stats.ts). Mas o AC nunca foi emendado — quem abrir a story daqui a três meses lê uma contradição entre AC5 e o código, e o rastro só se reconstrói lendo o Change Log inteiro.'
    suggested_action: '@po emendar o texto do AC5 para a assinatura efetivamente entregue, mantendo a nota de que a mudança veio do Should-Fix. Território do @po — @qa não edita ACs.'

  - id: 'MNT-001'
    severity: low
    finding: '`zeroBonus` é exportado e nunca chamado (código morto). O @dev documentou a escolha, e a story debt.3 já a consome (Task 2), então não é armadilha. Mas o projeto não tem script `lint` (package.json só tem dev/build/check/sim:check) e `tsc --noEmit` não sinaliza export não usado — nada no CI detectaria se debt.3 mudasse de ideia e a função ficasse órfã.'
    suggested_action: 'Nenhuma ação nesta story. Se debt.3 não passar a chamar zeroBonus, remover a função em vez de deixá-la exportada.'

  - id: 'ARCH-001'
    severity: low
    finding: 'sim/types.ts e sim/stats.ts agora se importam mutuamente. Hoje é inofensivo: os dois lados usam `import type`, apagado pelo type-stripping do Node e pelo bundler, então não existe ciclo em runtime (confirmado — sim:check roda). O risco é futuro: se alguém em debt.2/debt.3 trocar `import type` por import de valor em qualquer das duas pontas (ex.: importar STAT_KEYS em types.ts), o ciclo vira real e a ordem de inicialização passa a importar.'
    suggested_action: 'Registrado para não ser redescoberto como surpresa. Se debt.3 precisar de STAT_KEYS em types.ts, mover os tipos compartilhados para um terceiro módulo em vez de fechar o ciclo.'

  - id: 'PERF-001'
    severity: low
    finding: 'ABS_MIN/ABS_MAX são `Partial<StatBlock>`, então 4 das 14 chaves (dmg, atkSpeed, cdSpeed, range) são leituras de propriedade ausente dentro do laço de recomputeStats — miss de shape resolvido pela cadeia de protótipo, e um branch `!== undefined` por chave. Custo real hoje é desprezível (4 bolas × 60Hz × 14 chaves = 3.360 acessos/s) e a exigência de §7.1 que a story cita é sobre ALOCAÇÃO, que está atendida com zero alocação por chamada.'
    suggested_action: 'Nenhuma agora. Se o arnês da Fase 2 (40M ticks) apontar recomputeStats no perfil, trocar por StatBlock completo com sentinelas ±Infinity — remove os dois branches e uniformiza o shape.'

  - id: 'DOC-001'
    severity: low
    finding: 'Todos os checkboxes de Tasks/Subtasks (Task 1 a 5) e os de Quality Gate Tasks continuam `[ ]` com a story implementada e em InReview — mesma ocorrência já registrada no gate de debt.0 (DOC-001). Está virando padrão, não lapso isolado.'
    suggested_action: '@dev marcar os checkboxes ao concluir cada task. Seção de Tasks é território do @dev — @qa não edita.'

