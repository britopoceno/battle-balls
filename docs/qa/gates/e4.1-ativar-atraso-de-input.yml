  - 'No aparelho alvo de P3.4, jogar uma rodada completa no modo local.'
  - 'AC 6: ao arrastar, a linha de mira aparece e segue o dedo sem atraso. Se o arrasto tiver lag, a story reprova.'
  - 'AC 7: o efeito sai perceptivelmente depois do toque (~100ms). Isso atrapalha ou não?'
  - 'E41-UX-001: algum toque dado logo depois de um cast "sumiu"?'
  - 'Escrever uma frase em "Impressão do smoke (AC 7)" no Dev Agent Record e acionar o @qa para o re-gate.'

