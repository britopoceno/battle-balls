story: 'debt.15'
story_title: 'Teto natural do replay, 8 canários na guarda da v2, identidade do base do personagem e sujo do carimbo ancorado na raiz'
gate: CONCERNS
story_status_after_gate: Done
status_reason: >-
  Os 9 ACs estão MET, e os quatro achados de origem estão fechados: E412-REL-001, E412-TST-001,
  E411-TST-001 e E412-ARC-001. Refiz as verificações do zero em cópias descartáveis de fc21c3b e do pai
  2ce07e8 (git archive, node_modules por junção), sem confiar no Dev Agent Record. check, sim:check e
  build deram rc=0. O golden hash é o mesmo do pai. O diff da saída do sim:check contra o pai tem só as
  três linhas permitidas: `bordas` (sufixo R1), `replay teto` e `replay canár`, ambas novas. O escopo
  são 4 dos 5 arquivos permitidos, e em net/replay.ts só muda comentário. No servidor real, com o
  roteiro spam do gate da e4.12 (30 cliques por jogador), o código com o teto antigo deu replay:check
  rc=1 ("não terminou (fase builds)"), e o código corrigido deu rc=0. O arquivo do teto antigo,
  verificado pelo código corrigido, deu rc=0, e 200 cliques por jogador (424 passos) também deram rc=0.
  As 10 mutações do AC 8, as 8 sobreviventes do gate da e4.12 (na minha formulação de lá) e a QM-B2
  reprovam todas, cada uma pela mensagem da própria guarda. A matriz do sujo (AC 9) bate com a emenda
  nas 5 variantes × 5 cenários, e mais 6 cenários meus. O veredito é CONCERNS, e não PASS, por 2 LOW
  de teste: (1) a guarda `replay teto` só prova que o teto passou de 65 passos, e um teto fixo de 128
  passa verde (DEBT15-TST-001); (2) três mutações de campos vizinhos passam verdes (DEBT15-TST-002).
  Nenhum dos dois bloqueia a coleta da e4.7.
reviewer: 'Quinn (@qa)'
reviewed_revision: >-
  commit:fc21c3b (implementação). O pai é 2ce07e8. 2f5a2d6 é o registro do @dev e toca só a story.
  `git diff fc21c3b HEAD -- src package.json` sai vazio. fc21c3b NÃO está em origin/master
