status_reason: >-
  Os 15 ACs estão MET. Refiz as verificações do zero, em cópias descartáveis de a9ad204 (git archive,
  node_modules por junção), sem confiar no Dev Agent Record. check, sim:check e build deram rc=0. O
  golden hash é o mesmo da base 47d6517 e do pai 57b154b, e o diff da saída do sim:check contra os dois
  é só a linha de replay mais três linhas novas. O escopo são os 5 arquivos do AC 14. sala.ts e
  protocolo.ts não foram tocados, e a linha de criarSala não mudou. Os greps do AC 15 e o de pureza de
  net/replay.ts dão o esperado. Contra o servidor real, com roteiro e portas meus (5341-5345), rodei
  duas Bo5 simultâneas (rc=0 nos dois arquivos), um W.O. na rodada 1 (rc=0, com a linha de W.O. no
  tick 93; ticks−1 dá rc=1 pelo hash, e lido como v1 também dá rc=1), uma partida interrompida (rc=0
  com a linha "interrompida"; dizendo 'fim', rc=1) e o Q8 (FALHA: os dois arquivos reprovam). As três
  v1 honestas da e4.6 continuam verificando. As 7 mutações da story (M1-M4, Q5, Q15, Q12) reprovam, e o
  Q8 FALHA no servidor real. Das minhas 15 mutações, 6 foram pegas, 1 é equivalente, e as 8 sobreviventes caem em lacunas
  LOW. O veredito é CONCERNS, e não PASS, por 1 MEDIUM que não foi
  introduzido por esta story e 3 LOW.
  (1) E412-REL-001 (medium): o teto MAX_PASSOS = 64 de reproduzirPartida (decisões + rodadas) é
  controlado pela entrada do jogador. Medi no servidor real: um replay honesto dá rc=1 com "não
  terminou (fase builds)", e o mesmo arquivo com o teto alto dá rc=0. Isso é um falso negativo
  possível na prova de P4.3 da e4.7.
  (2) E412-TST-001: a guarda não enxerga o termo de teto da classificação, as duas conferências de
  coerência da partida interrompida, a validação por campo da v2 no lerReplay nem a propagação do
  carimbo.
  (3) E412-DOC-001: o 9aa1b500 do AC 6 não é reproduzível a partir do driver descrito na §7.3.
  (4) E412-ARC-001: `sujo` sai true por arquivo não rastreado fora de src/. É a nota do AC 4,
  medida de novo, e o dono é o @architect.
