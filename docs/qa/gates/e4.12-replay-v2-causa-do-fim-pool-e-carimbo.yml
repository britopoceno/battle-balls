top_issues:
  - id: 'E412-REL-001'
    severity: medium
    category: code
    owner: '@po (roteia) → @dev (src/tools/partida.ts); a e4.7 precisa saber antes da coleta'
    finding: >-
      reproduzirPartida para com "replay de S não terminou" quando decisões + rodadas passam de 65
      (MAX_PASSOS = 64, que vem da Regra 3, com roteiro fixo). No replay, esse número é controlado pela
      entrada do jogador. `{t:'build'}` é aceito quantas vezes chegar antes do pronto (redutor.ts,
      aplicarBuild). Todo clique num dos 8 botões da tela de build manda um, mesmo no botão já marcado
      (telas.ts:162, main.ts:558). A sala grava todos. MEDIDO: nos replays reais honestos, uma Bo5 de 3
      rodadas dá 19 passos, de 4 rodadas 24 e de 5 rodadas 29. Repetindo o primeiro build K vezes, a
      falha começa em exatamente 66 passos (K = 47 com 3 rodadas, K = 37 com 5). No SERVIDOR REAL (porta
      5345), 30 cliques por jogador na fase builds deram 64 builds aceitos e 79 passos, e replay:check deu
      rc=1 com "a reprodução não chegou ao fim da partida: … não terminou (fase builds)". O MESMO arquivo,
      numa cópia com MAX_PASSOS = 640, dá rc=0. É falso negativo puro. Sem cliques redundantes o teto
      não é atingido. O pior caso de 7 rodadas é: 4 draft + 4 build + 2 pronto + 7 rodadas + 12 prontos
      de loja + no máximo 22 compras ou trocas (a renda soma 38, e os juros dão no máximo 3 por loja, o
      que dá cerca de 56 de ouro por jogador, ao preço mínimo de 5), ou seja, ≤ 51. A folga no pior caso
      é de cerca de 15 cliques redundantes (os dois jogadores somados). Não foi introduzido por esta story
      (é da e4.6), e o @dev o registrou. É MEDIUM porque é um falso rc=1 controlado pela entrada, num
      instrumento de prova de portão: a regra da e4.7 (AC 8) trata como "achado de determinismo" toda
      partida sem W.O. que reprove.
    suggested_action: >-
      @dev: no caminho do replay (quando `como` é passado, ou sempre em reproduzirPartida), trocar o teto
      fixo pelo limite natural `g.decisoes.length + g.rodadas.length + 1`, já que cada volta consome uma
      decisão ou uma rodada gravada. MAX_PASSOS fica para jogarPartida e para o roteiro por política. Pede
      uma guarda com um replay de muitos builds redundantes que verifica. Antes da coleta da e4.7, @po:
      ou a correção entra, ou o README da coleta classifica "não terminou (fase …)" como excluída, e não
      como achado de determinismo.
  - id: 'E412-TST-001'
    severity: low
    category: tests
    owner: '@po (roteia; próxima story que abrir determinism.ts ou replay-check.ts)'
    finding: >-
      Mutações que passam verde no sim:check. (a) R1: a classificação sem o termo `w.tick >=
      tetoDeTicks`. Nenhuma rodada da guarda chega ao teto, e uma rodada de teto com empate viraria 'wo'
      com vencedor −1 e reprovaria. Na prática o teto é inalcançável hoje (morte súbita aos 60 s, máximo
      medido de 76,8 s contra um teto de 180 s). (b) R3 e R4: as duas conferências de coerência da
      'interrompida' (todas as decisões consumidas; a reprodução não chegou a 'fim') não têm canário. Um
      arquivo de partida completa rotulado 'interrompida' passaria sem conferência de placar. (c) R6, R6b,
      R6c e R6d: a validação por campo da v2 em lerReplay (encerramento por rodada e da partida, pool não
      vazio, forma do codigo) não tem caso negativo. Só o `formato` é testado (v0/v3/ausente). Hoje, um
      campo inválido acaba reprovando alto ou só muda um aviso. (d) R13: montarReplay perdendo o carimbo
      passa verde, porque a guarda grava com CODIGO_DESCONHECIDO e confere null. Só o servidor real mostra
      o commit. É a lição de e4.8 (guarda por caso ≠ por campo) e de e4.9 (mutar cada termo).
    suggested_action: >-
      Canários baratos: a Bo5 da guarda gravada com um carimbo sentinela não nulo, conferido depois de
      lerReplay; a Bo5 completa rotulada 'interrompida', que tem de reprovar; a 'anular' com uma decisão
      extra no fim, que tem de reprovar; um caso negativo por campo da v2. (a) pode ficar como está
      enquanto o teto for inalcançável, com uma tripwire que registre isso, se o @architect quiser.
  - id: 'E412-DOC-001'
    severity: low
    category: docs
    owner: '@po (texto do AC 6) / @architect (opcional: publicar o driver da W-2)'
    finding: >-
      O AC 6 cita "9aa1b500 no tick 90, na medição da fonte". Esse valor não se reproduz a partir do
      driver que a §7.3 descreve. Com os atalhos escritos, o meu driver corta no tick 90 com 7aec17ab, e
      esse valor é idêntico em 3e46e3d, 47d6517 e a9ad204. Ele depende de detalhe não escrito do driver.
      O que o AC mede (W.O. numa rodada ≠ 0, rc=0 com a linha, hash no tick do corte, ticks−1 reprovando)
      vale em todas as 24 variações que rodei, no servidor real (tick 93) e na guarda (tick 60, 452f7c25).
    suggested_action: >-
      @po: marcar 9aa1b500 como ilustrativo da medição da fonte, e não como valor a reproduzir. Opcional,
      @architect: anexar o driver da W-2 à §7.3.
  - id: 'E412-ARC-001'
    severity: low
    category: architecture
    owner: '@architect (§7.3 item 4)'
    finding: >-
      `sujo` é `git status --porcelain` não vazio na árvore inteira. Medido: na cópia com git, deu true só
      por `?? node_modules/` (a junção). Na árvore do projeto, dá true pelos `.claude/agent-memory/**`
      modificados e não rastreados. Nos dois casos src/ é idêntico ao commit. É a nota do AC 4, que o @po
      já tinha registrado, agora medida por mim. Não bloqueia: o carimbo só avisa, e a e4.7 não usa
      `sujo` (AC 8 de lá).
    suggested_action: >-
      @architect: decidir se o campo passa a ser `git status --porcelain -- src/ package.json
      package-lock.json tsconfig.json` (ou `--untracked-files=no`). A mudança vai numa story que abra
      server/main.ts, e não é bump de formato (o tipo do campo não muda).

avaliacoes_pedidas:
  hash_452f7c25_vs_9aa1b500: >-
    O AC 6 CONTINUA MET. O valor 9aa1b500 é da medição da fonte, com um driver cujos atalhos a §7.3
    descreve só em parte. O meu driver independente, com os atalhos escritos, dá 7aec17ab no tick 90, e
    o mesmo valor nos três commits (3e46e3d, 47d6517 e a9ad204). Então o hash depende do estímulo, e não
    do código. O que o AC exige vale na guarda (tick 60, 452f7c25), no meu driver (24 variações) e no
    servidor real (tick 93): W.O. numa rodada ≠ 0, rc=0 com a linha de W.O., hash conferido no tick do
    corte e ticks−1 reprovando PELO HASH. Desvio aceito. O texto vai em E412-DOC-001.
  recusadas_no_verificador: >-
    DENTRO DO ESCOPO. O AC 3 e o canário de pool do AC 7 pedem que "a reprodução recuse a escolha e
    reprove". Devolver as recusas é o mecanismo que torna isso explícito. Está em tools/partida.ts e
    tools/replay-check.ts, os dois no AC 14. A mudança é aditiva: campos novos em PartidaReproduzida, e
    compararPartida (a Regra 3) não os lê. A linha "replay ✓ ok — 6 seeds reproduzidas sem bot" do
    sim:check é idêntica. A sala grava só decisões aceitas (conferido no gate da e4.6), e as 3 v1 honestas
    e os 4 v2 honestos que gravei (as duas Bo5 simultâneas, o W.O. e a interrompida) têm 0 recusas. Tem dente: R16 (recusas não coletadas) dá sim rc=1. No
    Q8 real, é o que dá a causa legível ("decisão 10 (draft/j0, fase loja)").
  sujo_true: >-
    ROTEADO ao @architect como E412-ARC-001 (LOW). Não é defeito da story: o AC 4 manda `git status
    --porcelain` e já registrava o efeito. Medi as duas causas (a junção node_modules na cópia e
    .claude/agent-memory na árvore).
  max_passos_64: >-
    DEFEITO LATENTE CONFIRMADO no servidor real, MEDIUM, E412-REL-001. O dono é o @po, que roteia ao
    @dev. É anterior a esta story. Os passos realistas de uma Bo5 com a política de bot são 19 (3
    rodadas), 24 (4) e 29 (5). O pior caso de 7 rodadas sem clique redundante fica em ≤ 51, e o teto
    reprova a partir de 66. Então só builds redundantes estouram: 15 a 47 cliques extras, somando os
    dois jogadores, conforme a duração da partida e o ouro gasto. Um humano apressado ou curioso na tela
    de build chega lá, e um mal-intencionado chega com certeza. A e4.7 PODE bater nisso, e a regra dela
    classificaria o caso como achado de determinismo. A correção é de uma linha, e deve entrar antes da
    coleta, ou o README da coleta precisa da exclusão.

observacoes:
  - >-
    A observação do gate da e4.6 continua de pé para a partida 'fim': o verificador não exige que todas
    as decisões sejam consumidas. Com uma decisão extra depois do fim, aprova. Isso é inócuo num arquivo
    do servidor. A v2 passou a conferir o consumo só na 'interrompida'.
  - >-
    A M1 escrita como a da story (`e.encerramento = 'natural'`) deixa `w` sem uso, e o tsc reprova
    (TS6133). O sim:check reprova pelo W.O. de qualquer forma. A bateria do @dev registrou só o sim:check.
  - >-
    O verificador acrescenta "pode ser mudança de código" em QUALQUER problema com commit diferente, e não
    só em divergência de hash. É um superconjunto do AC 4, e aceito.
  - >-
    CodeRabbit não roda nesta máquina (não há WSL/CLI). A cobertura veio de check, sim:check e build em
    três commits, da leitura linha a linha do diff dos 5 arquivos, de 5 partidas contra o servidor real
    com roteiro meu, do driver W-2 independente, da sonda de MAX_PASSOS sobre replays reais e de 22
    mutações (7 da story e 14 minhas). As cópias e as junções foram removidas (junções com `.Delete()`),
    e o node_modules do repositório está intacto. Nenhum processo do gate ficou de pé, e nenhuma porta
    de 5341 a 5345 ficou escutando. A árvore compartilhada nunca foi mutada. Rodei nela só o
    `replay-check.ts`, que só lê, para ver o aviso de commit. Não usei 5179, 5231, 5232 nem 5281-5284.

