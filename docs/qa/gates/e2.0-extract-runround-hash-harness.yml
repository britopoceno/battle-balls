story: 'e2.0'
gate: PASS
status_reason: >-
  Extração verificada como refatoração pura por meio independente: 2.720 partidas
  velho-vs-novo (16 builds × 150 seeds + times assimétricos) sem uma divergência, e a
  saída do determinism.ts pré-extração (git archive HEAD) é idêntica linha por linha à
  pós-extração. Três achados LOW, nenhum sobre o entregável.
