top_issues:
  - id: 'REL-001'
    severity: low
    finding: 'A ordem dos throws finais faz o `throw` de autoconsistência (linha 126) preceder o do baseline (linha 127). Se a autoconsistência e o baseline falharem juntos — combinação provável numa refatoração ruim em debt.2 — a mensagem final do Error cita apenas "simulação não é determinística" e omite a do baseline. As linhas de desvio já foram impressas em stdout antes, então o diagnóstico não se perde, só a mensagem terminal.'
    suggested_action: 'Opcional em debt.1+: agregar as duas condições numa única mensagem de erro, ou lançar o baseline primeiro por ser o sinal mais informativo.'

  - id: 'MNT-001'
    severity: low
    finding: 'A mensagem de divergência de hash informa QUE o estado divergiu, não ONDE. Para debt.2 (migração de leitores de stat, onde a divergência esperada é aritmética), `hash esperado X, obtido Y` identifica a seed reprodutível mas não localiza o ponto da divergência — quem for depurar terá de instrumentar o tick a mão. Os campos ticks e vencedor dão sinal grosso apenas.'
    suggested_action: 'Não bloqueia debt.0 (AC 3 pede seed+campo+esperado/obtido e isso está entregue). Recomenda-se que debt.2 inclua no seu escopo um helper de bisecção — ex.: hash por tick para achar o primeiro tick divergente — em vez de assumir que esta mensagem basta para localizar aritmética.'

  - id: 'PERF-001'
    severity: low
    finding: 'O laço de baseline chama `rodar(seed)` uma terceira vez para as seeds 1, 2, 3, 7 e 11, que o laço de autoconsistência (seeds 1..40) já executou duas vezes cada. São 5 execuções redundantes de 85 (+6% de trabalho).'
    suggested_action: 'Impacto real desprezível — sim:check inteiro roda em <1s de wall clock. A independência entre os dois blocos é defensável como escolha de design. Nenhuma ação necessária; registrado só para não ser redescoberto como "bug" depois.'

  - id: 'DOC-001'
    severity: low
    finding: 'Todos os checkboxes de Tasks/Subtasks (Task 1 a 4) e os de Quality Gate Tasks continuam `[ ]` mesmo com a story implementada e em InReview. O CLAUDE.md exige marcá-los conforme concluídos.'
    suggested_action: '@dev deve marcar os checkboxes. Seção de Tasks é território do @dev — @qa não edita.'

  - id: 'DOC-002'
    severity: low
    finding: 'O commit d52c23d agrupou, junto da implementação, as edições de validação do @po nas stories debt.1 a debt.7 (Draft → Ready + Change Log). Mistura dois autores/fases num único commit.'
    suggested_action: 'Higiene de commit apenas — não afeta código. Observar separação em stories futuras.'

  - id: 'REQ-001'
    severity: low
    finding: 'O texto do AC 5 afirma que `grep -rn "Math.random" src/sim` retorna vazio; não retorna — casa o comentário de rng.ts:2. Já apontado pelo @po e documentado pelo @dev. A invariante substantiva (zero uso funcional) foi confirmada pelo @qa.'
    suggested_action: 'Nenhuma. Imprecisão de redação do AC, não de implementação. Corrigir a formulação se o AC for reaproveitado.'

