status_reason: >-
  Os 9 ACs estão MET, e DEBT11-TST-001 e DEBT11-TST-002 estão fechados. Conferi tudo do zero, sem confiar
  no Dev Agent Record. check, sim:check e build saíram com rc=0 num worktree descartável de 181db27, e o
  golden hash ficou idêntico. O diff da saída inteira do sim:check contra um worktree de 181db27^
  (c4b22db) é uma única linha trocada, a `telemetria`. `globais` é byte a byte igual, com 3 console.warn.
  `git show --stat 181db27` lista só os 2 arquivos do AC 9, e o diff de tools/telemetria.ts é só
  comentário. Os blobs commitados são LF, e o incidente de CRLF do @dev não deixou resíduo. Reapliquei
  as 12 mutações da story mais Q1 e T7, com os resultados declarados: as 12 nocivas com rc=1, Q1 e T7 com
  rc=0. Acrescentei 14 mutações minhas. A checagem R6 (soma das desconhecidas), que nenhuma mutação do
  @dev atingia, está viva (R6a, R6b e R6e reprovam o baseline) e tem dente: uma mutação de produção que
  trunca as populações desconhecidas (R6c) só é pega por ela. Com a R6 desligada, a mesma mutação passa
  verde (R6d). A R6 também segura Q13b sozinha quando a M2 inteira é afrouxada (X6). O limite do AC 7
  (campos trocados) não contamina evidência nenhuma: com as constantes iguais, a troca grava dados
  idênticos, e quando elas diferem a guarda acusa a troca (medido com ATRASO_ALVO_TICKS = 7). PASS, e
  não CONCERNS, porque os três achados são LOW, opcionais e sem efeito no dado.
reviewer: 'Quinn (@qa)'
