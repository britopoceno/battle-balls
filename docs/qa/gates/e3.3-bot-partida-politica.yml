status_reason: >-
  Os 16 ACs passam e foram verificados por **reexecução independente** — nada aceito do Dev Agent
  Record, e a bateria dirigida foi escrita por mim do zero (o script T1..T6 do @dev não foi lido nem
  reusado). `npm run check` 0 erros; `npm run sim:check` verde com **golden hash idêntico** nas 5
  seeds e nas 5 variantes de build.
  **Escopo provado por sha256 contra o estado exato registrado no gate de `e3.2`:** os 7 arquivos de
  `src/match/` batem os 7 hashes daquele gate dígito a dígito; `src/shop/`, `src/chars/`,
  `src/client/` e `src/sim/` não aparecem em `git status`; `src/tools/partida.ts` continua com 805
  linhas e `medirM1` devolve os MESMOS ticks do gate anterior (1059/963, 948/980, 829/1006), o que
  prova o arquivo intocado. Mudaram **exatamente dois** arquivos: `src/bot/partida.ts` (novo) e
  `src/bot/heuristic.ts`. Este último é **inserção pura, provado por sha256 e não por leitura**:
  apagar as linhas 77-114 do arquivo atual reproduz o `heuristic.ts` do commit `7ae95ee`
  **byte a byte** (`f113a8e0…`), logo `BOT_VERSION`, `BotConfig`, `PRESET_ARNES`, `createBot` e
  `botCommands` são literalmente os mesmos bytes.
  **Streams 5/6 reproduzidos por mim:** 8 seeds × 2 jogadores × 64 saques, `criarPolitica(s,j).rand()`
  idêntico a `mulberry32(deriveSeed(s, 5+j))`, e **disjunto** dos streams 0-4, 7, 8+i e do `world.rng`
  de cada uma das 7 rodadas possíveis.
  **A fronteira do AC 5 é do COMPILADOR, não de disciplina:** quatro sondas de tipo escritas por mim
  falham em `tsc` — ler `oponente.personagens[n].abilityIndex`/`passiveIndex` não compila
  (a chave não existe no ramo `revelado:false`), passar `EstadoPartida` onde se espera `VisaoPartida`
  não compila, e `criarPolitica(1, 2)` não compila.
  **Bateria negativa do gate: 7 perturbações aplicadas na árvore real, 7 detectadas**, arquivo
  restaurado com sha256 conferido (`b99dd9db…`). Inclui a que o meu próprio primeiro desenho de teste
  deixaria passar (violar o contrato de saque) — G9 foi escrita depois de a mutação passar verde.
  CONCERNS e não PASS por cinco registros, **nenhum de comportamento em jogo legítimo e nenhum
  bloqueante do push**. O central é de processo e é meu: **ARCH-E32-001, que o gate de `e3.2`
  declarou "entrada bloqueante do gate de `e3.3`", não foi pago e não podia ter sido** — a story fixou
  os arquivos em dois e a correção mora num terceiro. O @dev cumpriu a story corretamente; a corrente
  quebrou entre o meu YAML e a story. Re-alojado em `architecture-e3.md` §12.1, que é onde o @sm lê.
