story: 'debt.12'
story_title: 'Guarda do fio dirigida por tabela, fronteira de piso não inteira e fixture congelada — `E48-TST-001`, `E48-TST-002`, `E48-ARC-003` (parte 2) e `E49-TST-001`/`002`/`003`'
gate: CONCERNS
story_status_after_gate: Done
status_reason: >-
  Os 9 ACs estão MET, e também os dois acréscimos que o @architect pediu no meio da tarefa (188998e,
  §11.6.2): o item 5 da fixture com M-VARIANTE e o caso de versão errada `VERSAO_DO_FIO + 1`. Refiz tudo do
  zero, sem confiar no Dev Agent Record, em worktrees descartáveis de 5766137 e de 5766137^. check,
  sim:check e build saíram com rc=0, e o golden hash não mudou. O diff da saída inteira do sim:check tem
  só as quatro mudanças permitidas: texto acrescentado em `parser` e em `fronteira`, `6/6 → 10/10` em
  `versão fio` e a linha nova `fio congelado`. Gerei o texto congelado a partir do codec: são 287 B,
  iguais caractere a caractere à §11.6.1 e ao literal em FIO_CONGELADO, com ponto fixo válido. Reapliquei
  10 mutações da story, e as 10 saíram com rc=1. Rodei também 25 mutações minhas. E48-TST-001, E48-TST-002,
  E48-ARC-003 (parte 2) e E49-TST-001/002/003 estão fechados. O veredito é CONCERNS, e não PASS, por dois
  achados LOW de guarda que propõem mudança de código. (1) O canário do item 4 mede piso e arredondamento
  ingênuos, e não os do codec. Com um valor na borda de ponto flutuante (ultCharge 0.29), ele dá ✓ falso
  (P6b). (2) O item 5 só não é tautológico quando roda junto com `npm run check`. Sozinho, o sim:check
  deixa passar uma variante nova em DoServidor/T_DO_SERVIDOR que não tenha amostra (Q2a e Q2b rc=0; o tsc
  pega com rc=2), e nenhum CI roda check nem sim:check. Nenhum dos dois afeta o código de produção nem o
  valor congelado de hoje.
reviewer: 'Quinn (@qa)'
reviewed_revision: >-
