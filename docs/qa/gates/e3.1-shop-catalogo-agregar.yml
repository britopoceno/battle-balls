status_reason: >-
  Os doze ACs passam e foram verificados por reexecução independente — nada aceito do Dev Agent
  Record. Escopo provado por sha256: dos 17 arquivos registrados no gate de `e3.0`, exatamente UM
  difere (`src/tools/balance.ts`); `src/sim/world.ts` bate dígito a dígito com o gate de `e3.0`, o
  que prova que a correção de REL-001 está intacta e que `e3.1` não a tocou. Teste dirigido reescrito
  do zero por mim (11 blocos, 64 exigências, 64 passes) com poder discriminante demonstrado: reimplementei
  a soma NAIVE na ordem de compra como contrafactual no mesmo processo. **Reproduzi a separação
  que o @dev alegou e ela confere exatamente:** com a magnitude UNIFORME provisória, a implementação
  errada devolve os MESMOS valores que a canônica em 120 permutações — o teste do enunciado original
  de §7.3 não prova nada; com as quatro magnitudes de §1.6 no MESMO campo, a naive devolve DUAS saídas
  em 24 permutações (`0.4799999999999999822` e `0.4800000000000000377`) e `agregarItens` devolve UMA.
  A-10 está pago, e pago pelo motivo certo. `previewStat` confere com o `stat` da bola que
  `createWorld` cria nos 14 campos em 7 cenários (incluindo três em que o teto morde) — a loja não é
  terceira fonte de verdade. Couraça confere em 5 combinações, `hp === stat.maxHp` em todas.
  **O achado que o @dev devolveu está CERTO e a inversão era minha:** `ΣMAX.maxSpeed = +0,60` satura o
  Vex em 400 < 420 e `ABS_MAX.maxSpeed` exigiria base > 262,5 (roster: 250 e 105). Corrigi
  `architecture-e3.md` §7.2 (errata com a tabela de qual teto morde primeiro nos 5 campos afetados),
  §7.3 (errata do enunciado do teste A-10) e §1.3/§7.4 (censo de 9 leitores, pendência ARCH-E30-001
  fechada). CONCERNS e não PASS por quatro registros, nenhum bloqueante e nenhum de comportamento:
  o cabeçalho de `preview.ts` repete a afirmação FALSA que o @dev corrigiu em `catalogo.ts` (contradição
  interna à própria story, no arquivo que `e3.4` vai ler primeiro); a magnitude do Relicário é literal
  `0.25` e não constante nomeada, invisível a quem revisar D-09 pelas constantes; `validarCompra`/
  `validarCatalogo` são escopo ACEITO mas não têm chamador algum, o que os torna segurança que não
  roda; e `bolaSintetica` passou a ser exportada de diretório de produção com tipo de retorno que
  mente. `e3.2` está liberada.
