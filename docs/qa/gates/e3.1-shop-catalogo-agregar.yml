issues:
  - id: ARCH-E31-001
    severity: medium
    category: docs
    finding: >-
      **O cabeçalho de `src/shop/preview.ts` (linhas 16-17) repete a afirmação FALSA que o próprio @dev
      corrigiu em `catalogo.ts`.** Literal: "se o jogador comprar dois itens no mesmo campo e o teto
      morder, ele paga por um bônus que não recebe (**Turbina no Vex satura em `ABS_MAX.maxSpeed =
      420`**; a segunda Borracha é cortada em `restWall` mas não em `restBall` — ver os comentários dos
      itens em `catalogo.ts`)". A Turbina no Vex satura em **400**, pelo `ΣMAX`, e nunca em 420 —
      medido no motor neste gate e corrigido por 13 linhas de comentário em `catalogo.ts`, no mesmo
      commit, pelo mesmo autor. O comentário errado inclusive APONTA para o arquivo que carrega a
      correção, então quem seguir o ponteiro encontra a contradição.
      A metade da frase sobre a Borracha está correta e é uma boa ilustração; é só a Turbina que está
      invertida.
    impacto: >-
      Zero em comportamento — é comentário, e a implementação de `previewStat` está correta (provada
      contra o motor em 14/14 campos, 7 cenários). O impacto é o modo de falha que ESTA story existe
      para impedir, em escala pequena: a afirmação sobre um teto passa a viver em dois lugares e eles
      já discordam, no mesmo commit. E o lugar errado é o mais visível: `preview.ts` é o arquivo que
      `e3.4` abre para escrever a UI de "valor efetivo", e a primeira coisa que ele diz é qual teto
      explicar ao jogador. É exatamente o vetor da armadilha de sinal da Lixa, com teto em vez de sinal.
    recommendation: >-
      @dev: trocar `ABS_MAX.maxSpeed = 420` por `ΣMAX.maxSpeed = +0,60 (satura em 400 no Vex)` no
      cabeçalho de `preview.ts`, ou substituir a parte da Turbina por uma referência ao comentário do
      item em `catalogo.ts` para que a afirmação viva num lugar só. Uma linha, sem teste novo (nenhum
      teste toca comentário). Pode ir no mesmo commit desta story ou na primeira mão de `e3.2`.
      **Não bloqueia `e3.2` e não bloqueia o push.**

  - id: ARCH-E31-002
    severity: medium
    category: code
    finding: >-
      **A magnitude do Relicário é o literal `+0.25` na linha do item, e não uma constante nomeada.**
      O mérito da exceção está certo (com 0,20 o `desc` prometeria −20% e o motor entregaria −16,7%;
      +0,25 é o par literal de §7.2) e está justificado no comentário. O defeito é de FORMA: o AC 5 e o
      próprio JSDoc de `MAGNITUDE_PROVISORIA` cravam que "os números moram num lugar só, com o aviso em
      cima, e nada os lê senão através destas constantes" — e este número não mora lá. Uma varredura por
      `MAGNITUDE_PROVISORIA` (que é o que `e3.7` vai fazer ao revisar D-09) devolve 7 dos 8 itens.
    impacto: >-
      Nenhum hoje: o valor está correto e o comentário explica por quê. O impacto é diferido e concreto
      — `e3.6`/`e3.7` vão mexer nas magnitudes de D-09, e quem trocar `MAGNITUDE_PROVISORIA` de 0,20
      para o valor medido deixará o Relicário parado em 0,25 **em silêncio**, invertendo a relação que
      hoje é deliberada (0,25 > 0,20 porque a conversão de recarga não é linear). Se a magnitude nova
      for maior que 0,25, o Relicário passa a ser o item mais FRACO por acidente de refatoração. É o
      mesmo padrão que fez `packages.ts` existir, aplicado a magnitude em vez de sinal.
    recommendation: >-
      `MAGNITUDE_RELICARIO = 0.25` como constante nomeada ao lado de `MAGNITUDE_PROVISORIA`, com o
      aviso `⚠️ PROVISÓRIO — D-09` e uma frase dizendo que ela é DERIVADA da meta de `desc` (−20% de
      recarga ⇒ `1/(1+x) = 0.8` ⇒ `x = 0.25`) e não independente — o que dá a `e3.7` a fórmula em vez
      do número. ~4 linhas em `catalogo.ts`, sem mudança de valor e sem mudança de comportamento (o
      `stat` resultante é bit-idêntico). **Não bloqueia.** Entrada obrigatória de `e3.7`.

  - id: ARCH-E31-003
    severity: medium
    category: requirements
    finding: >-
      **`validarCompra` e `validarCatalogo` não têm chamador nenhum — nem de produção, nem de arnês,
      nem de carga de módulo.** Julgo o ESCOPO aceitável (ver `decisoes_de_julgamento`), mas o estado
      em que ficam é o pior possível para uma função de segurança: existe, está correta, está testada
      pelo teste descartável do autor e do gate, e **não roda**. O próprio @dev registrou isso no
      carry-forward #2 como risco; este gate o converte de nota de dev em obrigação de `e3.2`, porque
      nota de dev em story `Done` não é lida por ninguém.
      Agrava: `agregarItens` **ignora `id` desconhecido em silêncio** por construção (o laço externo é o
      catálogo, não a lista de compra) — decisão certa, porque é o que torna a invariante 1 estrutural
      em vez de defensiva, mas ela transfere 100% da detecção de "o jogador pagou por um item que não
      existe" para `validarCompra`. Sem chamador, esse modo de falha é indetectável.
    impacto: >-
      ARCH-E30-002 (entrada do meu gate de `e3.0`) atribuiu a validação de não-finitos em `itemBonus` a
      "quem popula o campo". A camada certa foi escrita. Se `e3.2` não a chamar, a atribuição continua
      não cumprida com a aparência de cumprida — que é pior do que continuar aberta, porque o gate de
      `e3.2` pode marcar ARCH-E30-002 como resolvido olhando o arquivo em vez do call graph.
    recommendation: >-
      **Entrada BLOQUEANTE de `e3.2`, não desta story:** `setupDaRodada` deve chamar `validarCompra`
      ANTES de escrever em `PickSetup.itemBonus`, e o gate de `e3.2` deve exigir a aresta no call graph
      (varredura por `validarCompra`), não a existência da função. Para `validarCatalogo`, o caminho
      mais barato é uma linha no bloco `problemasAutoteste` de `balance.ts` (`e3.2` ou `e3.6`), onde ela
      passa a rodar a cada `npm run balance` de graça — é o lugar onde os outros dez invariantes já
      moram, e a função foi escrita no padrão de `analisarMutacao` exatamente para caber ali.

  - id: ARCH-E31-004
    severity: low
    category: code
    finding: >-
      **`bolaSintetica` passou a ser exportada de diretório de produção com tipo de retorno que mente.**
      `return b as unknown as Ball` sobre um objeto de 4 campos (`base`, `bonusPassive`, `bonusItem`,
      `stat`) — a `Ball` real tem ~25, e `hp`, `alive`, `x`, `y`, `effects` e `contact` não existem
      nele. O cast é herdado, deliberado, documentado, e era inofensivo quando a função era privada
      dentro de `tools/balance.ts`: o único chamador era o autoteste, na mesma tela. Agora ela é
      `export` em `src/shop/`, e o `tsc` vai aceitar passá-la para qualquer coisa que peça `Ball` —
      `applyDamage`, `heal`, `weakestEnemy`, um render — todas as quais leriam `undefined` como número.
      §13.3 já registra este arquivo como o ponto do desenho de que menos gosto; isto é o preço concreto
      da recusa de `debt.1` a uma forma pura `(base, bonus) → StatBlock`, e a recusa continua certa
      (alocação em caminho quente).
    impacto: >-
      Nenhum hoje: os dois chamadores passam o resultado direto para `recomputeStats`, que lê 3 campos e
      escreve 1 (conferido no fonte). O risco é de superfície futura — `e3.4` escreve a tela da loja e
      vai ter uma função exportada que devolve uma `Ball` de mentira à mão.
    recommendation: >-
      Duas saídas, sem tocar `sim/`. (a) Reduzir a superfície: manter `bolaSintetica` não exportada e
      dar a `balance.ts` um `previewStatDeCampoUnico(base, campo, valor)` — mas `balance.ts` precisa da
      `Ball` para chamar `recomputeStats` ele mesmo e contar clamps, então isto custaria mais que vale.
      (b) A que eu recomendo: declarar em `preview.ts` um
      `type PortadorDeStats = Pick<Ball, 'base' | 'bonusPassive' | 'bonusItem' | 'stat'>`, tipar o
      objeto como ele (o que dá checagem real dos 4 campos, hoje inexistente) e manter o cast APENAS na
      fronteira da chamada a `recomputeStats`, com a justificativa ali. Torna explícito no TIPO o que
      hoje é só comentário. **Não bloqueia.** Candidata a `e3.4`, quando houver um segundo consumidor.

  - id: ARCH-E31-005
    severity: low
    category: code
    finding: >-
      `CATALOGO` é `readonly ItemDef[]` e `bonus` é `Readonly<Partial<BonusBlock>>` — garantias de
      COMPILAÇÃO apenas. Em runtime nada impede escrita, e eu aproveitei isso de propósito para poder
      perturbar o catálogo no teste do AC 7 (o que é bom: uma congelação impediria o único teste que
      prova A-10 hoje). Registro pela assimetria que ela cria: `validarCatalogo` existe para ACUSAR
      corrupção do catálogo, mas nada a PREVINE, e a corrupção que ela acusa só é alcançável por `as`
      ou JSON externo — que é precisamente o caminho que `e3.4` (UI) e uma eventual persistência de
      build abrem.
    impacto: >-
      Nenhum hoje. Nenhum consumidor de produção, e o literal é checado por `tsc`.
    recommendation: >-
      Não congelar agora — custaria o poder do teste de A-10 enquanto a magnitude for uniforme.
      Reavaliar em `e3.4`/`e3.5`, quando existir caminho de dado externo: se aparecer, `Object.freeze`
      profundo na carga do módulo é barato (fora de caminho quente) e transforma ARCH-E31-005 em
      garantia em vez de checagem. Registrado para não ser reinventado como "descuido".

decisoes_de_julgamento:
  - questao: >-
      O @dev alterou o comentário da Turbina para contradizer a armadilha que o AC 4 manda registrar
      literalmente. Isso é violação de AC?
    veredito: 'NÃO — foi a decisão certa, e o defeito é do meu documento. Corrigido por mim neste gate.'
    razao: >-
      Reconferi a aritmética por medição própria e o @dev está certo em todos os números.
      `recomputeStats` clampa o SOMATÓRIO antes de multiplicar pela base
      (`sigma = clamp(raw, SIGMA_MIN, SIGMA_MAX)` → `stat = clamp(base × (1+sigma), ABS_MIN, ABS_MAX)`),
      logo `ABS_MAX[k]` só é alcançável se `base × (1 + ΣMAX[k])` já o exceder.
      `ΣMAX.maxSpeed = 0.6` (runtime), Vex base 250 ⇒ satura em **400**; 400 < 420. `ABS_MAX.maxSpeed`
      exigiria base > `420/1.6 = 262,5`, e o roster tem 250 e 105. Medi de 0 a 8 Turbinas: 250, 300,
      350, 400, 400, 400, 400, 400, 400 — satura na terceira e a quarta é 100% desperdiçada. O "+68%"
      de §7.2 era `420/250` lido sem o `ΣMAX` no caminho, e a inversão era minha, não do @dev.
      Escrever a armadilha falsa no código porque o AC a copia seria violar o Artigo IV (No Invention)
      para satisfazer a letra de um AC cuja fonte está errada — e num arquivo cuja única razão de
      existir é ser o lugar auditável onde nome, campo e sinal se encostam. A hierarquia certa é
      medição > documento > AC, e o @dev acertou nas três decisões que tomou: mediu, corrigiu o
      comentário, e NÃO tocou o AC nem a arquitetura (que não são dele).
      **Ação minha, executada:** `architecture-e3.md` §7.2 ganhou a linha da Turbina corrigida e uma
      seção de errata com a tabela de qual teto morde primeiro nos 5 campos afetados, medida no motor.
      Descobri no processo um erro OPOSTO no mesmo documento: o `ABS_MAX` **é** alcançável por item,
      só não em `maxSpeed` — ele morde na 2ª Borracha (`restWall` 0,92 sobre base 0,72) e na 6ª Lixa
      (`drag` 0,60 sobre a base 0,30 do Golem). Então o achado de `e2.8` ("nenhum clamp morde no roster
      atual") NÃO se estende à Fase 3, porque foi medido sem itens — e isso é mais importante que a
      errata original, porque o clamp absoluto passa a ser a primeira coisa que o jogador encontra na
      trilha física. Está escrito na errata.
      **Pendência para @po (não bloqueante):** o AC 4 desta story continua com o texto antigo. A story
      está `Done` e reescrever AC de story fechada é pior do que a divergência; mas se `e3.4` ou `e3.6`
      citarem "a armadilha da Turbina" pelo AC em vez de pela §7.2, herdam o erro. Recomendo que @po
      registre a errata na próxima story que tocar itens, apontando para §7.2.

  - questao: >-
      `validarCompra`/`validarCatalogo` não estão em nenhum AC. O @dev deveria ter esperado uma story
      própria?
    veredito: 'NÃO — escopo ACEITO, e a alternativa era pior. Mas com uma obrigação anexada a e3.2.'
    razao: >-
      Cinco critérios, e passa nos cinco. (1) **Havia dono declarado, e era esta camada.**
      ARCH-E30-002, entrada do meu próprio gate de `e3.0`, atribui a validação de não-finitos em
      `itemBonus` a "quem POPULA o campo", e a razão escrita lá é medida, não hipotética: `{dmg: NaN}`
      em `itemBonus` faz "% sem ativa" saltar para 50% porque todo cast decidido por valor esperado é
      suprimido (`NaN >= limiar` é `false`), e `{maxHp: NaN}` não aparece em detector nenhum — a rodada
      continua rodando e a saída sai plausível e errada. A loja é quem popula. (2) **Não cria caminho
      de exceção**, que é a linha vermelha do AC 9: devolvem `string[]`, nunca lançam, e conferi por
      teste que `agregarItens` continua não lançando mesmo com o catálogo corrompido. (3) **Não é
      invenção de padrão**: é `analisarMutacao` (`balance.ts:296`) reusado, mesma decisão de projeto
      (devolver mensagem, não abortar) tomada pelo mesmo motivo medido (gate de `e2.5`/BOT-006).
      (4) **Cabe no envelope de arquivos do AC 12** (`src/shop/`) e não põe uma linha em `sim/`, que é a
      fronteira que realmente importa — validação dentro de `sim/` seria a terceira fonte de verdade
      sobre "o que é um bônus legítimo", e é exatamente o que eu recusei em `e3.0`. (5) **É reversível
      a custo zero**: duas funções exportadas sem dependentes.
      A alternativa — esperar `e3.2` — deixaria `itemBonus` populável por `NaN` durante uma story
      inteira, com a camada que deveria barrar já escrita e sem a barra. E a `e3.2` chegaria tendo de
      escrever validação de um catálogo que não é dela, o que é pior divisão de responsabilidade.
      Contra-argumento que reconheço e que é a razão de ARCH-E31-003 existir: escrever segurança sem
      chamador é como escrever teste sem asserção. O que resolve não é remover as funções — é `e3.2`
      chamá-las, e agora isso é obrigação de gate e não nota de dev.

  - questao: >-
      A Fase A do teste do @dev (magnitude uniforme, 120 permutações) foi apresentada como evidência de
      A-10. Isso é evidência fraca reportada como forte?
    veredito: 'NÃO — o @dev desqualificou a própria evidência antes de mim, e é isso que a torna confiável.'
    razao: >-
      Reproduzi os dois cenários com a implementação naive como contrafactual e confirmo os dois lados:
      com magnitude uniforme a naive devolve os mesmos VALORES em 120 permutações (um `agregarItens`
      errado passaria), e com as magnitudes de §1.6 no mesmo campo ela devolve duas saídas em 24
      (`0.47999999999999998224` e `0.48000000000000003775`) enquanto a canônica devolve uma. A Fase B é
      o que prova, e o @dev escreveu isso no relatório antes de eu perguntar, com a frase "eu quase
      reportei que sim".
      Isto é o oposto do modo de falha que este projeto já pagou duas vezes ("golden hash verde =
      funciona"). Registro como o padrão a repetir: **evidência acompanhada da declaração do que ela
      NÃO prova.** O buraco real não estava no teste do @dev — estava no enunciado do teste em §7.3, que
      é meu, e que como escrito é satisfeito por uma implementação errada enquanto a magnitude for
      uniforme. Corrigido neste gate com o cenário discriminante e os dois corolários (perturbar em
      memória; ordem de chaves fixa).

  - questao: >-
      A extração foi para `shop/` e não `sim/`. Está certo?
    veredito: 'SIM, e por uma razão mais forte do que a que o @dev deu.'
    razao: >-
      O @dev alegou AC 12 (proíbe `sim/` ganhar linha) e a direção `shop → sim`. As duas valem, mas a
      razão decisiva é outra: `bolaSintetica` não é peça de motor — ela é uma **aproximação de `Ball`
      para fins de UI**, e o cast `as unknown as Ball` é a prova disso. Colocá-la em `sim/` daria a
      `sim/` uma função que constrói uma `Ball` incompleta de propósito, o que é convite para alguém
      usá-la como fábrica de bola de teste dentro do motor. Em `shop/` ela é o que é: uma ferramenta de
      preview de loja, do lado certo da fronteira, e o golden hash intacto é a prova de que a fronteira
      foi respeitada. O custo é ARCH-E31-004 (superfície exportada com tipo que mente), que é o
      trade-off certo e está registrado.

recomendacoes_para_e3_2:
  - >-
    **BLOQUEANTE:** `setupDaRodada` deve chamar `validarCompra(itens)` ANTES de escrever em
    `PickSetup.itemBonus`, e o gate de `e3.2` deve exigir a ARESTA no call graph, não a existência da
    função (ARCH-E31-003). Sem isso, ARCH-E30-002 fica não cumprida com aparência de cumprida.
  - >-
    `agregarItens` aloca um `Partial<BonusBlock>` novo por chamada. Correto para loja/UI, **proibido no
    caminho quente** (`architecture.md` §7.1). `e3.2` deve chamá-la **uma vez por rodada**, no setup, e
    nunca por tick. Registrado pelo @dev e endossado aqui: hoje não há chamador, então é uma proibição
    a fazer valer, não um defeito a corrigir.
  - >-
    `previewStat` precisa de uma `base` e `baseDeChar(def: CharDef): StatBlock` **não existe** — o único
    lugar que deriva um `StatBlock` de um `CharDef` é o literal inline de `makeBall` (`world.ts:141-151`).
    Enquanto não for extraído, o chamador passa `ball.base`. Extraí-lo é mudança em `sim/` e portanto
    move o golden hash **zero** (é `move`, não fórmula) — mas é `sim/` e precisa de AC próprio.
    A alternativa (duplicar o literal em `shop/`) é a segunda fonte de verdade que o projeto acabou de
    pagar para não ter: **recusar**.
  - >-
    `ECONOMIA_PROVISORIA` deve seguir o padrão estrutural de `MAGNITUDE_PROVISORIA`/`PRECO_PROVISORIO`
    (constante nomeada, aviso `⚠️ PROVISÓRIO — D-09` no topo, nada lê o número senão através dela) — e
    **não** repetir ARCH-E31-002: nenhum literal solto na linha do uso, nem com comentário justificando.
  - >-
    A errata de §7.2 é insumo de `e3.4` e de `e3.6`: o teto que a UI precisa explicar é o `ΣMAX` na
    Turbina e o `ABS_MAX` na Borracha e na Lixa. E o achado de `e2.8` ("nenhum clamp morde") **não**
    vale com itens.

recomendacoes_para_e3_6:
  - >-
    **Reportar mordida de clamp com a MAGNITUDE do corte ao lado, não só a contagem.** Medido neste
    gate: 3 Turbinas somam `0.6000000000000001`, o que ultrapassa `ΣMAX.maxSpeed = 0.6` por resíduo de
    float e **conta uma mordida** no contador de `e2.8` — mas o `stat` resultante é `400` dos dois
    lados. A mordida tem magnitude ZERO no número que o jogador vê. Ler isso pela tricotomia da §7.3
    ("morde sempre ⇒ virou regra de jogo por acidente") daria conclusão errada. Mesmo caso em
    `range`/Luneta (`ΣMAX.range` também é 0,60). `drag` (6 Lixas ⇒ `1.2` exato) e `maxHp` (5 Couraças ⇒
    `1` exato) não têm resíduo. Está escrito em §7.2.
  - >-
    Herdar de `e3.0` o censo de **9 leitores** de `hp / stat.maxHp`, com `bot/heuristic.ts:350`
    (`peso()`) nomeado como o único CONTÍNUO e de maior magnitude fora de `sim/`+`chars/`. Pendência
    ARCH-E30-001 agora escrita em `architecture-e3.md` §1.3 e §7.4 — não depende mais de gate lido.

alteracoes_no_documento_de_arquitetura:
  - secao: '§1.3'
    mudanca: >-
      Errata do censo de leitores de fração: "cinco" é o censo de `sim/`+`chars/` (o escopo onde o
      golden hash é juiz), não de `src/` — são **nove**. Nomeados os 4 de fora, com
      `bot/heuristic.ts:350` marcado como o único sem degrau. Fecha ARCH-E30-001, que estava pendente
      desde o gate de `e3.0`.
  - secao: '§7.2 (linha da Turbina)'
    mudanca: >-
      `teto ABS_MAX.maxSpeed = 420 morde antes de ΣMAX ... a partir de +68%` **→**
      `teto ΣMAX.maxSpeed = +0,60 — satura em 400 no Vex (250 × 1,60). ABS_MAX.maxSpeed = 420 é
      inalcançável por item`.
  - secao: '§7.2 (linha da Lixa)'
    mudanca: >-
      Acrescentado que é AQUI que o clamp absoluto morde antes do Σ: `ABS_MAX.drag = 0,60` sobre a base
      0,30 do Golem. A propriedade que §7.2 atribuía à Turbina existe — no item errado.
  - secao: '§7.2 (nova subseção "Errata — qual teto morde primeiro")'
    mudanca: >-
      A ordem de aplicação de `recomputeStats` explicitada, tabela medida de qual teto morde primeiro
      em 5 campos (`maxSpeed`, `drag`, `restWall`, `restBall`, `maxHp`), o registro de que o achado de
      `e2.8` não se estende à Fase 3 porque foi medido sem itens, e a nota de leitura dos contadores de
      clamp para `e3.6` (resíduo de float conta mordida de magnitude zero).
  - secao: '§7.3 (invariante 1)'
    mudanca: >-
      Errata do enunciado do teste A-10: "embaralhar e exigir byte-idêntico" é satisfeito por uma
      implementação ERRADA enquanto a magnitude for uniforme (medido: 120 permutações, mesmos valores).
      Acrescentado o cenário discriminante (duas magnitudes diferentes no mesmo campo) e os dois
      corolários (perturbar o catálogo em memória; ordem de chaves fixa em `STAT_KEYS`).
  - secao: '§7.4'
    mudanca: >-
      "Os cinco leitores de fração continuam como estão" reescrito para apontar a errata de §1.3 e para
      dizer o que o gate de `e3.0` mediu: eles não "continuam sem efeito", eles **voltam a ver a
      fração 1**.

