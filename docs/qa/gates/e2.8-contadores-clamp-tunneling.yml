      (`natureza: recomendacao-de-arquitetura-nao-requisito-de-rf`).

  - id: AC5
    verdict: PASS
    evidence: >-
      Verificado por três caminhos, e o terceiro é meu, não da story. (a) Leitura: dentro de `sim/`
      as ÚNICAS referências a `CLAMP_COUNTERS`/`TUNNELING_COUNTER` são declaração, reset e
