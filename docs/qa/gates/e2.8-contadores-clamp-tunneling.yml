acceptance_criteria:
  - id: AC1
    verdict: PASS
    evidence: >-
      Reexecutado do zero. `npm run check` (tsc --noEmit) sem saída. `npm run sim:check` verde em
      TODAS as linhas: determinismo ✓, golden hash ✓ (5 seeds batem o baseline), build coverage ✓
      (5 variantes), replay ✓, bot dupla exec ✓, bot replay ✓, guarda BOT-001 ✓, pilar 3 ✓.
      Conferido que o `BASELINE` de `src/tools/determinism.ts:78-84` é literalmente a tabela de
      `docs/architecture.md` §6.0 linhas 711-715 — {1:96de1201/753/t1, 2:f66a7416/961/t0,
      3:a8db9c28/830/t0, 7:cb77dbe0/831/t0, 11:6aede2d9/1168/empate} — e que `determinism.ts` está
      byte-idêntico (sha256 f2953f76…) ao gate de e2.7, isto é, o baseline não foi reescrito para
      caber no resultado.

  - id: AC2
    verdict: PASS
    evidence: >-
      As quatro tabelas de teto de `sim/stats.ts` são instrumentadas, cada uma por campo, e a
      contagem é sobre a CONDIÇÃO DO CORTE, não sobre a chamada: `if (raw < SIGMA_MIN[k])` /
      `else if (raw > SIGMA_MAX[k])` para o Σ (stats.ts:199-200) e a contagem dentro do próprio ramo
      de corte para o absoluto (stats.ts:205-212). Comparadores idênticos aos de `clamp()`
      (stats.ts:72), portanto o contador morde exatamente quando o valor morre. Os quatro mapas NÃO
      são simétricos e a implementação não presume que sejam: `resetClampCounters` reconstrói os
      mapas a partir das próprias tabelas (`if (ABS_MIN[k] !== undefined)`), não de uma lista
      paralela — 14 ΣMIN + 14 ΣMAX + 10 ABS_MIN + 8 ABS_MAX = 46, conferido em runtime pelo ensaio
      (8) e no `--json` (46 objetos serializados por contexto, inclusive os zerados).

  - id: AC3
    verdict: PASS
    evidence: >-
      `physics.ts:98-101`, dentro de `integrate`, exatamente a fórmula literal de
      `docs/architecture.md` §7.4 linha 845 — `limite = 0.5 * (2 * (menor + segundo))`
      (physics.ts:75), escrito SEM simplificar de propósito, e `sp * dt > limite` com comparador
      estrito. `sp` é o MESMO `Math.hypot(b.vx, b.vy)` que já existia para o `facing` (physics.ts:94)
      e que produziu o deslocamento — não uma segunda derivação, e nenhuma chamada nova de `hypot`
      no caminho quente. `menorSomaDeRaios` como soma dos DOIS MENORES raios entre as bolas VIVAS é
      a leitura correta de "duas bolas se atravessam se o deslocamento exceder 2×(r_a+r_b)": o par
      mais fácil de atravessar é o de menor soma.

  - id: AC4
    verdict: PASS
    evidence: >-
      `npm run balance` padrão reproduzido do zero, e a linha do rodapé bate NÚMERO A NÚMERO o que a
      story alega — "[golem,vex] vs [golem,vex] espelho · 2847670 · nenhum, de 46 contadores ·
