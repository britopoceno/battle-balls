avaliacao_dos_denominadores:
  pergunta: >-
    `calls` e `samples` não estão na letra de §7.3/§7.4. São interpretação razoável ou invenção de
    escopo (Artigo IV)?
  veredito: 'INTERPRETAÇÃO RAZOÁVEL — dentro de escopo'
  fundamentacao:
    - >-
      §7.3 não pede um contador: pede uma LEITURA de três estados (nunca / às vezes / SEMPRE). O
      terceiro estado é uma afirmação de fração, e é indecidível a partir de uma contagem crua: `6392`
      não se distingue de `6392 em 6392`. Sem denominador, um terço do texto literal da fonte fica
      sem implementação. O denominador é condição necessária para executar a letra, não acréscimo a
      ela.
    - >-
      §7.4 pede explicitamente um "número ACOMPANHADO". Uma contagem crua de um `--n=10` não é
      comparável com a de um `--n=3000` — medi as duas: 34495 e 10587589 amostras para o mesmo
      confronto. Sem denominador o número não sustenta a comparação que a própria fonte pede.
    - >-
      Os dois denominadores não medem NADA de novo sobre o jogo: contam invocações de código que já
      existia (`recomputeStats`, o laço de `integrate`). Não introduzem conceito de jogo, não são
      lidos por nenhum caminho de decisão, e desaparecem com `observing: false`.
    - >-
      O @dev declarou a interpretação no Dev Agent Record em vez de embuti-la em silêncio, com a
      rastreabilidade ao texto de origem. É exatamente a disciplina que o Artigo IV cobra — a
      violação seria inventar sem declarar, não interpretar e registrar.
  ressalva: >-
    A escolha do denominador tem uma consequência de leitura que o @dev não registrou, e ela é minha
    contribuição a esta discussão: com `chamadas` sobre TODAS as bolas, o terceiro estado de §7.3
    fica inalcançável no protocolo A/B. Ver QA-E28-003. Isso não muda o veredito de escopo — muda o
    que a legenda deveria dizer.

pontos_fortes:
  - >-
    `resetClampCounters` reconstrói os mapas a partir das PRÓPRIAS tabelas de teto. Campo novo em
    `ABS_MAX` ganha contador sozinho; campo removido perde o dele. Era o lugar óbvio para uma lista
    paralela de campos — a segunda fonte de verdade que este projeto já pagou três vezes (C3,
    AimSpec, MNT-001) — e o @dev não a criou.
  - >-
    Campo sem aquele teto declarado NÃO ganha contador, e a justificativa é correta e não óbvia: um
    `0` ali leria como "nunca mordeu" quando a verdade é "não existe teto para morder", e as duas
    coisas levam a decisões de produto opostas. O ensaio (8) confere em runtime que `dmg` não tem
    contador absoluto, isto é, a assimetria é asserida e não só comentada.
  - >-
    O `--json` traz os 46 um a um, inclusive os zerados, enquanto o console resume. É a distinção
    certa: resumir para leitura humana é legibilidade; esconder no dado impediria uma máquina de
    distinguir "nunca mordeu" de "não tem contador".
  - >-
    O interruptor `observing: false` por padrão faz o custo em jogo ser literalmente zero — nem o
    pré-passo dos raios de `integrate` roda. O ensaio (15) assere isso, o que é a metade verificável
    da promessa de "zero custo em jogo" de §7.4.
  - >-
    Os 15 ensaios permanentes existem porque a saída verdadeira de hoje é uma fila de zeros, e um
    contador morto produz a mesma fila. É a resposta direta às dívidas QA-E25-006 e QA-E26-003 dos
    gates anteriores, e a perturbação B confirma que eles ABORTAM a matriz, não só avisam.
  - >-
    A medição em si é o entregável, e ela cumpre o que §7.3 prometeu: "os tetos são raciocínio" virou
    "nenhum dos 46 mordeu em 2 847 670 recálculos", e "está seguro hoje" virou "0 de 2 841 927". Duas
    afirmações do arquiteto deixaram de ser argumento e viraram número reproduzível.

