top_issues:
  - id: 'QA-E28-001'
    severity: medium
    category: tests
    finding: >-
      O caminho `observing: true` não é coberto por nenhuma guarda permanente, e a story afirma o
      contrário em dois lugares no código ("o golden hash de `sim:check` é a prova (AC 1 / AC 5)",
      balance.ts:640; stats.ts:98). O golden hash roda com os contadores DESLIGADOS: ele certifica o
      caminho off. O caminho on — o único que a matriz de winrate inteira usa — não é certificado por
      nada. MEDIDO, não inferido: apliquei a perturbação `let v = b.base[k] * (1 + (obs ? raw : sigma))`
      em stats.ts, isto é, o arnês passa a medir um jogo SEM os tetos Σ enquanto o jogo entregue
      continua com eles. Passou por tudo — `npm run check` EXIT=0, `sim:check` verde (golden hash E
      build coverage), os 15 ensaios permanentes verdes, e até a minha própria paridade nas 5 seeds
      do baseline (porque com o roster de hoje nenhum clamp morde, então `raw === sigma` e a
      perturbação é invisível nessas seeds). O único vestígio foi o denominador do MESMO contexto de
      medição cair de 23963 para 23417 chamadas de `recomputeStats` — número que ninguém compara com
      nada — enquanto o CLI continuava imprimindo "A linha acima mediu o valor CORTADO, não o
      pedido", que a essa altura era falso. Registro que a implementação ATUAL está correta (provei a
      paridade on/off nas 5 seeds); o que falta é a rede que garante que continue.
    suggested_action: >-
      Um 16º ensaio em `autotesteContadores`, de duas chamadas: para uma bola em que o clamp MORDE
      (`bolaSintetica('dmg', 1, 1.5)`), rodar `recomputeStats` com `observing: false` e com
      `observing: true` e asserir que o `stat` resultante é idêntico campo a campo. Pega a
      perturbação acima diretamente. É melhor que uma paridade de partida inteira, que — como medi —
      NÃO pegaria, porque nas seeds do baseline nenhum clamp morde.

  - id: 'QA-E28-002'
    severity: medium
    category: tests
    finding: >-
      Os 15 ensaios exercitam `resetClampCounters`/`resetTunnelingCounter` chamando-as DIRETO. Quem o
      AC 6 governa, porém, é o `medir` — e sobre `medir` não há uma asserção. MEDIDO: troquei em
      `medir` as duas chamadas de `resetTunnelingCounter` por um liga/desliga puro do `observing`,
      sem nunca zerar. O denominador passou a acumular monotonicamente entre contextos do mesmo
      processo — 34495 → 68990 → 102209 → 137173 → 171668 → 205826 → 237078 no `--risco-1b` — que é
      LITERALMENTE o modo de falha que o AC 6 nomeia ("não misturar contagem de confrontos diferentes
      num único número"). `npm run check` EXIT=0, os 15 ensaios verdes, nenhum ⚠, nenhum abort, saída
      plausível. Só um humano lendo a coluna e reparando no crescimento monótono perceberia. Nota em
      favor da implementação: `medir` reseta na entrada E na saída, então remover só um dos dois é
      inofensivo (perturbação E, confirmada como no-op) — a defesa é dupla hoje. Esta é a QUARTA
      ocorrência desta classe no épico (gates de e2.5: "a fiação entre partes testadas não é
      testada"; e2.6: "perturbar a fiação que lê a constante"; e2.7/QA-E27-001: "o sinal é decidido
      num call site que nenhuma asserção cobre").
    suggested_action: >-
      Um ensaio que chame `medir` DUAS vezes com a mesma carga sintética e asserir que o segundo
      retrato é igual ao primeiro — e, explicitamente, que não é a soma dos dois. Cobre os dois
      contadores e o call site de uma vez, sem rodar partida nenhuma.

  - id: 'QA-E28-003'
    severity: low
    category: requirements
    finding: >-
      A TERCEIRA leitura de §7.3 — "clamp que morde SEMPRE virou regra de jogo por acidente" — é
      praticamente inalcançável no denominador escolhido, para o caso em que ela mais interessa. O
      alerta dispara em `frac >= 1` (balance.ts:2537), com `frac = vezes / chamadas`, e `chamadas`
      conta `recomputeStats` de TODAS as bolas. No protocolo A/B só 1 das 4 bolas carrega a mutação,
      então um clamp que morda em 100% das chamadas em que PODERIA morder lê ~26,7% — que é
      exatamente o número medido para ΣMAX dmg. O teto de `frac` nesse desenho é ~0,25-0,27, e a
      mensagem "MORDE SEMPRE" nunca sai. Continua alcançável para tetos que mordam em todo o roster
      (que é defensavelmente o caso central de §7.3), então é limite de LEITURA, não erro de
      contagem — a legenda impressa, porém, não avisa disso e um leitor concluiria "nunca chega a
      morder sempre" quando a verdade é "este denominador não consegue mostrar isso".
    suggested_action: >-
      Uma cláusula na legenda dizendo que `frac` é sobre TODAS as chamadas do contexto (todas as
      bolas), e que num A/B de 1 bola mutada em 4 o teto observável é ~25%. Alternativa mais forte, se
      a trichotomia importar como contrato: contar também as chamadas por bola que carrega o bônus
      daquele campo, e usar essa como denominador do alerta.

  - id: 'QA-E28-004'
    severity: low
    category: docs
    finding: >-
      "nenhum, de 46 contadores" lê como "nenhum teto do jogo mordeu", e a premissa de §7.3 que
      autoriza essa leitura ("todos os tetos moram em `sim/stats.ts` como constantes nomeadas") não é
      verdadeira hoje. Fora dos 46 existem pelo menos `MIN_ABILITY_CD_MS = 500` (world.ts:46, o teto
      EFETIVO de `cdSpeed`, aplicado em world.ts:436 — e justamente a constante que um gate anterior
      subiu de 400 para 500, QA-001/commit 4c2e458) e `MAX_SLOW = 0.85` (world.ts:32, teto da soma de
      lentidão). Nenhum dos dois tem contador. Confirmei que isto NÃO é buraco desguarnecido:
      `MIN_ABILITY_CD_MS` é coberto estaticamente pela auditoria A2 do roster
      (`determinism.ts:420-441`, `cdEfetivoMinimo = max(MIN_ABILITY_CD_MS, ability.cd/cdSpeedMax)`),
      herdada de debt.4. Conferi também que `range` e `atkSpeed` NÃO têm teto no ponto de consumo
      (world.ts:465 e 482 são multiplicação pura), logo o Σ os cobre por inteiro. Sobra o texto: a
      saída não diz quais tetos ficam fora da conta nem onde eles são vigiados.
    suggested_action: >-
      Uma frase na legenda nomeando os tetos fora dos 46 (`MIN_ABILITY_CD_MS`, `MAX_SLOW`) e onde
      são vigiados (auditoria A2 do roster, no `sim:check`). Custo de uma linha, e fecha a distância
      entre a premissa de §7.3 e o estado real do código.

