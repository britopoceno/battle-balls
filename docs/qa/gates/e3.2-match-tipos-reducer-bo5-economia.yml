  src/tools/partida.ts (novo, 805 linhas) ·
  MODIFICADOS: src/sim/rng.ts (SÓ comentário — ver abaixo) · src/tools/determinism.ts (+28 linhas:
  1 import, 1 chamada a `verificarPartida()`, 2 blocos de impressão, 1 `throw`) ·
  `src/sim/` conferido por sha256 contra 7ae95ee, arquivo a arquivo:
  effects.ts IDÊNTICO · index.ts IDÊNTICO · physics.ts IDÊNTICO · stats.ts IDÊNTICO ·
  types.ts IDÊNTICO · world.ts IDÊNTICO · rng.ts DIFERE — e o diff das linhas não-comentário
