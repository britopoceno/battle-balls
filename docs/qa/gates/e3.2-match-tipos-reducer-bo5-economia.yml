  src/bot/ contém apenas dummy.ts e heuristic.ts (nenhum `partida.ts`) e não aparece em git status ·
  src/client/ não aparece em git status ·
  ALTERADO PELO GATE (documento, não código): docs/DEVELOPMENT-BIBLE.md §7.5
