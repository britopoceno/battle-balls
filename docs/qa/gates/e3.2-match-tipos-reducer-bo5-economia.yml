story_title: '`src/match/` — tipos, redutor `aplicar`, `setupDaRodada`, Bo5 + D-02, economia provisória, `visaoPara`'
gate: CONCERNS
status_reason: >-
  Os 29 ACs passam e foram verificados por reexecução independente — nada aceito do Dev Agent Record.
  `npm run check` 0 erros; `npm run sim:check` verde com **golden hash idêntico** nas 5 seeds e nas 5
  variantes de build. Escopo provado por sha256 contra o commit de `e3.1` (7ae95ee): dos 7 arquivos de
  `src/sim/`, **seis batem dígito a dígito** e o sétimo (`rng.ts`) difere **só em comentário** —
  provado por diff das linhas não-comentário, que é vazio. `src/bot/partida.ts` não existe e
  `src/client/*` não aparece em `git status`: `e3.3` e `e3.4` não vazaram.
  **Os dois achados centrais do @dev foram reproduzidos por mim e conferem exatamente.** (1) A mutação
  "aceita compra SEM debitar" passa **verde** pelo teste de replay — e mais forte do que ele reportou:
  os hashes das 3 partidas saem **byte-idênticos** aos da implementação correta (`d4c28105 e1dde398
  15c4854d` etc.), porque o erro é consistente entre gravação e replay. Com `invarianteCompra` ativa a
  mesma mutação produz 4 problemas e o `sim:check` lança. (2) Zerando `itemBonus` em `setupDaRodada`,
  o golden hash continua ✓, o replay de partida continua ✓, e **só** a guarda `ponte itemBonus`
  acusa — a guarda extra-AC do @dev é genuinamente portante, não decoração.
  `validarCompra` tem os dois chamadores de produção alegados, conferidos no fonte
  (`redutor.ts:340`, lista FUTURA `[...itens, itemId]`; `setup.ts:80`, antes de `agregarItens`):
  **ARCH-E31-003 fechado dos dois lados**, com `validarCatalogo` ligada na bateria.
  CONCERNS e não PASS por quatro registros, nenhum de comportamento em jogo legítimo e nenhum
  bloqueante do push: a medição de M-1 embarcada no `sim:check` está **confundida** e não mede o que
  a linha que ela imprime afirma (ARCH-E32-001, entrada obrigatória de `e3.3`); o redutor **quebra ou
  aceita em silêncio** `Decisao` malformada, que é a fronteira que a Fase 4 abre (ARCH-E32-002); o
  `pool` do draft não é consumido e o comentário promete um parâmetro que não existe (ARCH-E32-003);
  e há literais `3`/`7` soltos na guarda de D-02 onde `REGRAS_PADRAO` já existe (ARCH-E32-004).
  `e3.3` está liberada, com ARCH-E32-001 como entrada bloqueante do gate dela.
reviewer: 'Aria (@architect) — quality_gate declarado na story'
