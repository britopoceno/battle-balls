status_reason: >-
  Os 12 ACs passam sob verificação independente e todos os números do Dev Agent Record foram
  reproduzidos do zero, dígito a dígito: P2.2 dá 79,63% ±3,46 (+27,38pp, ✗ fora, 7,1 larguras de IC
  acima da borda) e P2.3 dá 52,25% ±3,46 (? inconclusivo) no n default. O sinal do `drag` está
  fechado nas DUAS pontas — perturbei `PACOTES.fisico.drag` para `−0.2` (barrado por
  `autotestePacotes`) e, o que o @dev não testou, inverti o sinal no CONSUMO
  (`itemBonus` recebendo `-v`, com `packages.ts` intacto): barrado por `autotesteAb`. E
  `--mutacao=vex:mass:+0.20 --mutacao=vex:drag:+0.20` devolve 60,62% / 829 seeds, número idêntico
  ao de `--pacote=fisico --alvo=vex`, provando em runtime que o pacote nomeado É o par de sinais
  corretos e não só na fonte.
  O que segura o PASS não é defeito de código: é que **o comando literal do portão P2.3 não fecha
  veredito no n que o próprio portão especifica**. Anexo B manda rodar
  `npm run balance -- --pacote=nenhum`; com os defaults (n=800, seed=1) o resultado é
  `? inconclusivo`. Medi por que: a regra de 3 estados de §4.4 exige que o IC INTEIRO caiba em
  45–55%, o que a n=800 (IC ±3,46pp) deixa uma janela conclusiva de apenas ±1,54pp em torno de 50%
  — um pipeline PERFEITAMENTE justo tem só **61,5%** de chance de sair conclusivo. Confirmei
  empiricamente que o pipeline É justo, o que é a afirmação substantiva de P2.3: seis bases de seed
  independentes a n=800 dão 52,25 · 49,13 · 49,50 · 50,13 · 50,50 · 48,63, **média 50,02%**, e
  cinco das seis saem `✓ dentro`. A seed base 1 — o default — é a amostra azarada. P2.3 é
  verdadeiro e está provado; o que falta é o portão registrar um `n` em que ele seja DEMONSTRÁVEL.
