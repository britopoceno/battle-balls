acceptance_criteria:
  - id: AC1
    verdict: PASS
    evidence: >-
      `src/tools/packages.ts` existe, tem 54 linhas, é dado puro e o único import é
      `import type { BonusBlock }` — type-only, some no runtime. `PACOTES` é literal de §5.2:
      `fisico { mass: +0.2, drag: +0.2 }`, `dano { dmg: +0.2 }`, `nenhum {}`. O comentário nomeia o
      item e o sinal ao lado de cada valor, como §5.2 exige. `as const satisfies Record<string,
      Pacote>` impede campo fora de `BonusBlock` em tempo de compilação.
  - id: AC2
    verdict: PASS
