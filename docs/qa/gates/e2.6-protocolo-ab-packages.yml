      P2.2 rodado por mim: 79,63% ±3,46 · +27,38pp · ✗ fora · n_dec 800 / n_seeds 802. Bate o
      alegado dígito a dígito.
    - >-
      P2.3 rodado por mim: 52,25% ±3,46 · ? inconclusivo · n_dec 800 / n_seeds 823. Bate o alegado
      dígito a dígito. Também n=2000 (51,15% ±2,19 ✓) e n=5000 (49,58% ±1,39 ✓).
    - >-
      Ampliação minha, não pedida pela story: P2.3 a n=800 em CINCO bases de seed adicionais
      (1001/2001/3001/4001/5001) → 49,13 · 49,50 · 50,13 · 50,50 · 48,63, todas ✓ dentro. Com a
      seed 1, média das seis = 50,02%. É o que separa "o pipeline é justo" (verdadeiro) de
      "o comando do portão fecha veredito" (falso a n=800).
    - >-
      Armadilha do sinal reproduzida: `--pacote=fisico --alvo=vex` → 60,62% (+8,38pp) e
      `--mutacao=vex:mass:+0.20 --mutacao=vex:drag:-0.20` → 54,13% (+1,88pp). +1,88 < +2,00
      dispara o gatilho; +8,38 não. Confirmado.
    - >-
      **Prova de equivalência que a story não fez:**
      `--mutacao=vex:mass:+0.20 --mutacao=vex:drag:+0.20` devolve **60,62%, n_seeds 829** —
      número e contagem de seeds IDÊNTICOS aos de `--pacote=fisico --alvo=vex`. Isso prova em
      RUNTIME que o pacote nomeado equivale ao par de sinais corretos e que os dois percorrem o
      mesmo caminho; o autoteste sozinho só prova o conteúdo da constante.
    - >-
      Bordas de entrada, cada uma isolada, todas EXIT=1 e todas em ~1s (contra ~16s de execução
      limpa, o que prova que a recusa é ANTES de rodar partida): `--mutacao=vex:dmg:abc`,
      `:NaN`, `:Infinity`, `:1e400`, `:` (vazio), `:0x10`. Mais oito recusas de escopo/coerência:
      `--risco-1b` (nomeando `e2.7`), `--pacote=drag:0.2`, `--pacote`+`--mutacao` juntos,
      `--comp=golem,golem --mutacao=vex:…` (alvo fora da comp), `--alvo` sozinho, dois `--mutacao`
      em personagens diferentes, `--alvo=zzz`, flag inexistente. Controle limpo `--n=2` → EXIT=0.
  bateria_de_perturbacao_propria:
    metodo: >-
      Cópia isolada de `src/` no scratchpad; cada perturbação aplicada, `node src/tools/balance.ts
      --n=2` executado, arquivo restaurado. Controle limpo antes (EXIT=0) e sha256 do `src/` real
      conferido depois (`balance.ts` 1f289e86… e `packages.ts` 6d8edda9… inalterados).
    resultado: '7 de 8 detectadas; a 1 não detectada virou QA-E26-003.'
    perturbacoes:
      - 'P1 `PACOTES.fisico.drag` +0.2 → −0.2 → EXIT=1 (`autotestePacotes`, mensagem cita §5.2 e os +4,32/−5,90pp). Reproduz #1 do @dev.'
      - 'P2 `fisico.drag` +0.2 → +0.0001 (sinal certo, valor errado) → EXIT=1. A metade que o @dev não cobriu: não é só o sinal que está pinado, é o valor literal.'
      - 'P3 `NOMES_PACOTE` reordenado (controle deixa de ser o primeiro) → **EXIT=0, não detectada** → QA-E26-003.'
      - 'P4 `icPp(nDec)` → `icPp(nSeeds)` em `rodarConfronto` → EXIT=1 (ensaio 3b). Era QA-E25-001; a guarda de fato acusa.'
      - 'P5 `vereditoDe(winrate, nDec)` → `nSeeds` → EXIT=1 (ensaio 6).'
      - >-
        P6 **a mais valiosa, e o @dev não a fez**: sinal invertido no CONSUMO, não no dado —
        `itemBonus: {...bonus}` trocado por um map que nega cada valor, com `packages.ts` INTACTO.
        → EXIT=1 (`autotesteAb` (1), que afirma `picks[0].itemBonus.dmg === 0.2`). O sinal está
        fechado nas duas pontas: quem "corrigir" o dado é barrado por `autotestePacotes`, quem
        inverter a fiação é barrado por `autotesteAb`. Era o buraco natural de uma story cujo tema
        é um sinal.
      - 'P7 `FORMATO_VALOR` → `/^.+$/` → EXIT=1 (`0x10` passa a ser aceito). As duas checagens não são redundantes, como o TSDoc afirma.'
      - 'P8 `conferirClamp` ignorando a passiva (`const p = 0`) → EXIT=1 (ensaio (4), Golem/Âncora). O caso que uma checagem só do item erraria está pinado.'
  aritmetica_conferida_por_fora:
