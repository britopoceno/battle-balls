entradas_obrigatorias_dos_gates_anteriores:
  QA-E25-001:
    verdict: PASS
    evidence: >-
      O @dev está CERTO e confirmei lendo o caminho real: `rodarConfronto` sempre chamou
      `icPp: icPp(nDec)` (linha 741) e `veredito: vereditoDe(winrate, nDec)` (linha 742). Nunca
      houve bug de cálculo no CLI — o achado de `e2.5` era de COBERTURA, e assim estava redigido.
      O ensaio 3b novo é melhor do que eu pedi: além de `t3.res.icPp === icPp(t3.res.nDec)`, ele
      afirma `icPp(nDec) !== icPp(nSeeds)`, ou seja o próprio autoteste garante que o cenário
      DISCRIMINA — não pode virar vácuo se alguém mexer no ensaio 3. Reproduzi a perturbação em
      cópia isolada: `icPp(nDec)` → `icPp(nSeeds)` agora dá EXIT=1 com a mensagem do ensaio 3b.
  QA-E25-002:
    verdict: PASS
    evidence: >-
      Perturbei `veredito: vereditoDe(winrate, nDec)` → `nSeeds` em `rodarConfronto`: EXIT=1 pelo
      ensaio (6) ("veredito 'fora' com n_dec 0"). O ensaio de teto usa executor que sempre empata e
      fixa `nSeeds === 2·ceil(n/2)·TETO_SEEDS_POR_DECIDIDA` e `nDec === 0`.
  QA-E25-006:
    verdict: PASS
    evidence: >-
      `autotesteFechar` existe com 3 rodadas sintéticas cobrindo os quatro contadores de §4.5. O
      denominador (rodada × bola) é discriminado de propósito por duas bolas de golem por rodada —
      é o detalhe que impede a troca por "rodadas" de passar despercebida.
  REL-002 / BOT-006 / BOT-007:
    verdict: PASS
    evidence: >-
      Rodei as seis recusas da missão, cada uma isolada, e todas dão EXIT=1 ANTES de qualquer
      partida (retorno em ~1s contra ~16s de execução limpa): `abc`, `NaN`, `Infinity`, `1e400`,
      vazio, `0x10`. A validação é na RAIZ (`analisarMutacao`, linha 251), não no detector de kit
      morto — que era a exigência do gate de `e2.5`, porque `{maxHp: NaN}` não aparece naquela
      tabela. Perturbei `FORMATO_VALOR` para `/^.+$/`: EXIT=1, prova de que a checagem de formato
      não é redundante com `Number.isFinite`. Um resíduo em QA-E26-002.

issues:
  - id: QA-E26-001
    severity: medium
    category: requirements
    description: >-
      **O portão P2.3, como especificado, não é conclusivo no `n` que ele próprio manda usar.**
      Anexo B registra `npm run balance -- --pacote=nenhum` como a verificação de P2.3; com os
      defaults (n=800 de §6.2, seed=1) o CLI devolve **52,25% ±3,46 · `? inconclusivo`**.
      Não é falha do código nem desequilíbrio: é a interação entre a regra de 3 estados de §4.4
      ("✓ dentro" exige o IC INTEIRO dentro de 45–55%) e o piso de n=800 de RF-48. A n=800 o IC é
      ±3,46pp, o que deixa uma janela conclusiva de apenas ±1,54pp em torno de 50% — só 30,8% da
      faixa de 10pp. Um pipeline PERFEITAMENTE justo (p = 0,50, dp = 1,77pp) tem probabilidade
      **61,5%** de sair conclusivo. Ou seja, o critério oficial reprova por falta de amostra em
      ~2 de cada 5 execuções mesmo quando tudo está certo.
      Medi que é isso e não outra coisa: seis bases de seed independentes a n=800 dão
      52,25 (seed 1) · 49,13 · 49,50 · 50,13 · 50,50 · 48,63 — **média 50,02%**, e CINCO das seis
      saem `✓ dentro`. A seed base 1, que é o default, é a amostra azarada. E subir o n com a mesma
      seed resolve: n=2000 → 51,15% ±2,19 ✓ dentro; n=5000 → 49,58% ±1,39 ✓ dentro.
      Probabilidade de veredito conclusivo por n, para um pipeline justo: n=800 → 61,5%;
      n=1000 → 77,1%; n=1500 → 94,4%; n=2000 → 98,8%; n=3000 → ~100%; n=10000 → ~100%.
      Por que isso é MEDIUM e não LOW: o portão da Fase 2 é o entregável desta fase, e um portão
      cujo comando literal devolve "inconclusivo" ou é lido como reprovação (errado) ou é
      contornado ad hoc por quem o executa (pior). Por que não é HIGH nem FAIL: a afirmação de
      P2.3 está PROVADA por seis caminhos, o CLI acerta ao recusar-se a chamar isso de aprovação,
      ele imprime uma linha própria explicando que é falta de n, e a story registrou a
      recomendação em vez de esconder o resultado.
    recommendation: >-
      **Fixar o `n` do portão P2.3 em `--n=3000` e registrar isso no Anexo B de
      `docs/architecture-e2.md`** (linha de P2.3, coluna "Como se verifica"), substituindo
      `npm run balance -- --pacote=nenhum`. n=2000 é o mínimo defensável (98,8%); n=3000 leva a
      ~100% e custa ~55s. n=800 NÃO é configuração defensável para um portão.
      Recomendação operacional, medida: **um único comando entrega P2.2, P2.3 e P2.4 juntos** —
      `npm run balance -- --mutacao=vex:dmg:+0.30 --n=3000` imprime a linha `nenhum` (o controle
      de P2.3, seeds e números IDÊNTICOS aos de `--pacote=nenhum`; conferi: 800/823/52,25% nos
      dois) e a linha `dmg +0.30` (o mutante de P2.2) na mesma tabela, ~2,5 min. Ressalva de
      leitura: nessa invocação o rótulo da primeira linha sai como "linha-base (§5.3)" e não
      "P2.3 — controle negativo", então quem auditar o portão precisa saber que é a mesma medição.
      Dono: @pm (é decisão de portão) com @architect (Anexo B é do documento de arquitetura).
      Não bloqueia `e2.7`.
  - id: QA-E26-002
    severity: low
    category: code
    description: >-
      Resíduo da classe que o @dev declara fechada (bug previsto #3, "`Number('')` é 0 e aceitaria
      uma mutação nula em silêncio"): `FORMATO_VALOR` aceita notação científica
      (`(?:[eE][+-]?\d+)?`), e `Number('1e-400')` é **0**, finito, portanto aprovado nas duas
      checagens. Rodei: `npm run balance -- --mutacao=vex:dmg:1e-400 --n=6` → **EXIT=0**, tabela
      normal, linha de tratamento `dmg +0.00` com `delta +0.00pp`. É a mesma armadilha da string
      vazia por outra porta — um "mutante" que o operador acredita ter injetado e que não existe,
      lido como "mutante não detectado". Mitigação parcial já presente e é o que segura em LOW: o
      rótulo imprime `dmg +0.00`, então não é totalmente silencioso, e a linha de controle pareada
      torna o delta zerado visível. `1e-400` também não é entrada plausível de digitação humana.
    recommendation: >-
      Uma linha em `analisarMutacao`, depois do `Number.isFinite`: recusar `valor === 0` nomeando
      que `--pacote=nenhum` É o controle negativo e que uma mutação nula disfarçada de mutação é o
      pior modo de falha do arnês. Acrescentar `{ entrada: 'vex:dmg:1e-400', aceita: false }` e
      `{ entrada: 'vex:dmg:0', aceita: false }` a `CASOS_MUTACAO`. Alternativa mais conservadora,
      se zero explícito tiver uso: manter o aceite e imprimir aviso próprio quando o valor efetivo
      for 0. Cabe em `e2.7` ou `e2.8`.
  - id: QA-E26-003
    severity: low
    category: tests
    description: >-
      A ORDEM de `NOMES_PACOTE` é contrato documentado e não fixado. O TSDoc de `packages.ts` diz
      "Ordem de apresentação: **o controle primeiro**. Não é estética — é a ordem em que a bateria
      de §5.4 é lida (o delta de todo pacote é medido CONTRA o controle) e a ordem que `e2.7` vai
      percorrer", e a Completion Note 10 repete a promessa. Mas `autotestePacotes` compara
      `Object.keys(PACOTES).sort()` contra `[...NOMES_PACOTE].sort()` — conjuntos, não sequências.
      Perturbei `NOMES_PACOTE` para `['fisico', 'dano', 'nenhum']` em cópia isolada: **EXIT=0**,
      nenhum autoteste acusa, nenhuma saída muda hoje. Hoje é inofensivo porque nada consome a
      ordem; passa a importar no instante em que `e2.7` percorrer a lista assumindo que o primeiro
      elemento é o controle contra o qual todos os deltas são medidos.
    recommendation: >-
      Uma linha em `autotestePacotes`: `if (NOMES_PACOTE[0] !== 'nenhum') problemas.push(…)`,
      citando que o delta de §5.4 é medido contra o controle. Entrada obrigatória de `e2.7` — ou
      `e2.7` não depende da ordem, e aí o TSDoc é que precisa parar de prometê-la.
  - id: QA-E26-004
    severity: low
    category: requirements
    description: >-
      Os números de Risco #1b a n=800 não são conclusivos contra o gatilho de +2pp, e a story os
      apresenta como se a comparação estivesse decidida. Reproduzi os dois: a INTENÇÃO
      (`{mass:+0.20, drag:+0.20}`) dá **+8,38pp** e a LETRA do PRD (`{mass:+0.20, drag:−0.20}`) dá
      **+1,88pp** — exatamente o alegado, e os pontos caem em lados opostos do gatilho "físico <
      +2pp". Mas o gatilho é um limiar sobre o DELTA, e o IC do delta (diferença de duas
      proporções, mesmo n) é **±4,90pp a n=800**, não os ±3,46pp da coluna impressa. Com isso
      +1,88pp tem IC [−3,0 ; +6,8]: atravessa o +2pp dos dois lados, e a distância entre as duas
      leituras (6,50pp) fica a ~1,9σ. A conclusão de PRODUTO da story continua correta e a decisão
      de arquitetura de §5.2 (pacotes nomeados) não depende disso — mas "a leitura literal DISPARA
      o gatilho" é afirmação pontual, não estabelecida. IC do delta por n: 800 → ±4,90pp;
      2000 → ±3,10pp; 5000 → ±1,96pp; 10000 → ±1,39pp.
    recommendation: >-
      Entrada para `e2.7`: dimensionar o `n` da bateria de #1b pelo IC do DELTA, não pelo do
      winrate, porque o gatilho é um limiar sobre o delta. Para separar +2pp de forma conclusiva é
      preciso n ≥ ~5000 por célula. E considerar imprimir uma coluna de IC do delta ao lado da
      coluna `delta` — hoje a única barra de erro na tabela é a do winrate, o que convida
      exatamente à leitura que este achado corrige.

